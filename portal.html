<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientsky portál — Nemocnica Snina</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="siteHeader"></header>
<main id="main"></main>
<footer id="siteFooter"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/wearables-demo-data.js"></script>
<script>
Site.mount({ active: "" });
const pat = DB.get("patient");
const main = document.getElementById("main");
let loggedIn = sessionStorage.getItem("ns_portal") === "1";
let view = "overview";

function render() {
  if (!loggedIn) { renderLogin(); return; }
  renderDashboard();
}

function renderLogin() {
  main.innerHTML = `
  <section class="section">
    <div class="container" style="max-width:460px">
      <div class="card login-card">
        <div class="login-head">
          <span class="login-ic">${icon("shield")}</span>
          <h2>${esc(L({sk:"Zabezpečený vstup",en:"Secure login"}))}</h2>
          <p class="small" style="color:#cfe">${esc(L({sk:"Prihlásenie cez rodné číslo a SMS kód (eZdravie).",en:"Sign in with your National ID and SMS code (eHealth)."}))}</p>
        </div>
        <form id="loginForm" class="card-pad">
          <label class="field"><span>${esc(L({sk:"Rodné číslo",en:"National ID"}))}</span>
            <input type="text" placeholder="850315/1234" required></label>
          <label class="field"><span>${esc(L({sk:"Bezpečnostný PIN / SMS kód",en:"Security PIN / SMS code"}))}</span>
            <input type="password" placeholder="••••••" required></label>
          <button type="submit" class="btn btn-primary btn-lg btn-block mt-1">${icon("lock")} ${esc(L({sk:"Autorizovať a vstúpiť",en:"Authenticate & enter"}))}</button>
          <p class="small muted text-center mt-2 mb-0">${esc(L({sk:"Overené cez Identitu · údaje šifrované (CMEK).",en:"Verified via Identity · data encrypted (CMEK)."}))}</p>
        </form>
      </div>
      <p class="small muted text-center mt-2">${esc(L({sk:"Ukážkový portál — zadajte čokoľvek pre vstup.",en:"Demo portal — enter anything to continue."}))}</p>
    </div>
  </section>`;
  document.getElementById("loginForm").onsubmit = (e) => { e.preventDefault(); loggedIn = true; sessionStorage.setItem("ns_portal","1"); render(); };
}

function navBtn(key, label, ic) {
  return `<button class="pnav-btn ${view===key?'active':''}" data-v="${key}">${icon(ic)} ${esc(L(label))}</button>`;
}

function renderDashboard() {
  main.innerHTML = `
  <section class="section">
    <div class="container">
      <div class="card card-pad portal-header">
        <div class="flex-center gap">
          <span class="avatar avatar-lg">${esc(initials(pat.name))}</span>
          <div>
            <h2 class="mb-0" style="font-size:1.5rem">${esc(L({sk:"Vitajte",en:"Welcome"}))}, ${esc(pat.name)}</h2>
            <div class="flex gap wrap small muted mt-1">
              <span>${esc(L({sk:"RČ",en:"ID"}))}: ${esc(pat.id)}</span>
              <span>${esc(L({sk:"Krvná skupina",en:"Blood"}))}: <b style="color:var(--red)">${esc(pat.blood)}</b></span>
              <span>${esc(pat.insurance)}</span>
            </div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout">${icon("lock")} ${esc(L({sk:"Odhlásiť",en:"Sign out"}))}</button>
      </div>

      <div class="portal-grid mt-3">
        <aside class="pnav">
          ${navBtn("overview",{sk:"Prehľad",en:"Overview"},"activity")}
          ${navBtn("teleconsult",{sk:"Telekonzultácie",en:"Teleconsultations"},"video")}
          ${navBtn("records",{sk:"Zdravotné záznamy",en:"Health records"},"doc")}
          ${navBtn("meds",{sk:"e-Recepty",en:"e-Prescriptions"},"pill")}
          ${navBtn("labs",{sk:"Výsledky",en:"Lab results"},"flask")}
          ${navBtn("wearables",{sk:"Wearables",en:"Wearables"},"watch")}
        </aside>
        <div id="pview"></div>
      </div>
    </div>
  </section>`;
  document.getElementById("logout").onclick = () => { loggedIn = false; sessionStorage.removeItem("ns_portal"); render(); };
  main.querySelectorAll(".pnav-btn").forEach(b => b.onclick = () => { view = b.dataset.v; renderDashboard(); });
  renderView();
}

function renderView() {
  const v = document.getElementById("pview");
  if (view === "overview") {
    const ap = pat.appointments[0];
    v.innerHTML = `
      <div class="grid grid-2">
        <div class="card card-pad" style="border-top:4px solid var(--green)">
          <h4 class="flex-center gap-sm">${icon("calendar")} ${esc(L({sk:"Najbližší termín",en:"Upcoming appointment"}))}</h4>
          ${ap?`<p class="mb-0" style="font-size:1.15rem;font-weight:700">${esc(L(ap.clinic))}</p>
            <p class="muted mb-1">${esc(fmtDate(ap.date))} · ${esc(ap.time)}</p>
            <p class="small muted mb-2">${esc(ap.doctor)}</p>
            <a href="objednanie.html" class="small" style="font-weight:700">${esc(L({sk:"Preobjednať",en:"Reschedule"}))}</a>`
            :`<p class="muted">${esc(L({sk:"Žiadne plánované termíny.",en:"No upcoming appointments."}))}</p>`}
        </div>
        <div class="card card-pad" style="border-top:4px solid var(--blue-600)">
          <h4 class="flex-center gap-sm">${icon("activity")} ${esc(L({sk:"Posledná aktivita",en:"Recent activity"}))}</h4>
          <ul class="activity-list">
            <li><span>${esc(L({sk:"Lipidový profil — výsledok",en:"Lipid panel — result"}))}</span><a href="#" onclick="view='labs';renderDashboard();return false">${esc(L({sk:"Zobraziť",en:"View"}))}</a></li>
            <li><span>${esc(L({sk:"e-Recept: Nebivolol",en:"e-Prescription: Nebivolol"}))}</span><span class="muted">${esc(L({sk:"Spracované",en:"Processed"}))}</span></li>
          </ul>
        </div>
      </div>
      <div class="card card-pad mt-3 quick-req">
        <div><h4 class="mb-0">${esc(L({sk:"Digitálne žiadosti",en:"Digital requests"}))}</h4>
        <p class="small muted mb-0">${esc(L({sk:"Požiadajte o e-Recept alebo administratívny dokument bez návštevy.",en:"Request an e-prescription or document without a visit."}))}</p></div>
        <div class="flex gap-sm wrap">
          <button class="btn btn-ghost btn-sm" onclick="view='meds';renderDashboard()">${icon("pill")} e-Recept</button>
          <a href="objednanie.html" class="btn btn-primary btn-sm">${icon("calendar")} ${esc(t("book"))}</a>
        </div>
      </div>`;
  }
  else if (view === "records") {
    v.innerHTML = sectionCard(L({sk:"Aktívne diagnózy (FHIR: Condition)",en:"Active conditions (FHIR: Condition)"}),
      pat.conditions.map(c => `
        <div class="rec-row">
          <div>
            <h4 class="mb-0">${esc(L(c.dx))}</h4>
            <p class="small muted mb-0">ICD-10: ${esc(c.code)} · ${esc(L({sk:"diagnostikované",en:"diagnosed"}))} ${esc(fmtDate(c.date))} · ${esc(c.doctor)}</p>
          </div>
          <span class="badge badge-green"><span class="dot"></span>${esc(L({sk:"Aktívna",en:"Active"}))}</span>
        </div>`).join(""));
  }
  else if (view === "meds") {
    v.innerHTML = sectionCard(L({sk:"Aktívne e-Recepty (FHIR: MedicationRequest)",en:"Active e-Prescriptions (FHIR: MedicationRequest)"}),
      pat.meds.map(m => `
        <div class="rec-row">
          <div>
            <h4 class="mb-0" style="color:var(--blue-800)">${esc(m.name)}</h4>
            <p class="small muted mb-0">${esc(L(m.dose))} · ${esc(L({sk:"predpísané",en:"prescribed"}))} ${esc(fmtDate(m.date))}</p>
          </div>
          <div class="flex-center gap-sm">
            <span class="small muted">${esc(L({sk:"Opakovania",en:"Refills"}))}: ${m.refills}</span>
            <button class="btn btn-ghost btn-sm" onclick="alert('${esc(L({sk:"Žiadosť o opakovanie odoslaná lekárovi.",en:"Refill request sent to your physician."}))}')">${esc(L({sk:"Požiadať",en:"Request"}))}</button>
          </div>
        </div>`).join(""));
  }
  else if (view === "labs") {
    v.innerHTML = sectionCard(L({sk:"Laboratórne výsledky (FHIR: Observation)",en:"Lab results (FHIR: Observation)"}),
      pat.labs.map(l => `
        <div class="rec-row">
          <div>
            <h4 class="mb-0">${esc(L(l.test))}</h4>
            <p class="small muted mb-0">${esc(fmtDate(l.date))} · ${esc(L(l.dept))}</p>
          </div>
          <div class="text-right flex-center gap-sm">
            <div>
              <div style="font-weight:700;font-size:1.05rem;color:${l.flag==='high'?'var(--red)':'var(--ink)'}">${esc(L(l.result))}</div>
              <div class="small" style="font-weight:700;color:${l.flag==='high'?'var(--red)':'var(--green)'}">${esc(l.flag==='high'?L({sk:"Zvýšené",en:"High"}):L({sk:"V norme",en:"Normal"}))}</div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="return false">${icon("download")} PDF</button>
          </div>
        </div>`).join(""));
  }
  else if (view === "teleconsult") {
    const tcTab = sessionStorage.getItem("ns_tc_tab") || "upcoming";
    const tcSessions = TELECONSULTS[tcTab] || [];
    const isUp = tcTab === "upcoming";
    const tabBtnTc = (key, lbl) =>
      `<button class="tc-tab${tcTab===key?" active":""}" onclick="sessionStorage.setItem('ns_tc_tab','${key}');renderView()">${esc(L(lbl))}</button>`;
    const joinable = (at) => { const d = new Date(at)-Date.now(); return d<=600000 && d>-3600000; };
    const cdLbl = (at) => {
      const ms = new Date(at)-Date.now(); if (ms<=0) return "";
      const dy=Math.floor(ms/86400000), hr=Math.floor(ms%86400000/3600000), mn=Math.floor(ms%3600000/60000);
      return L(dy>0?{sk:`Za ${dy}d ${hr}h`,en:`In ${dy}d ${hr}h`}:hr>0?{sk:`Za ${hr}h ${mn}min`,en:`In ${hr}h ${mn}m`}:{sk:`Za ${mn} min`,en:`In ${mn}m`});
    };
    const tcCards = tcSessions.length===0
      ? `<div class="tc-empty"><span class="tc-empty-ic">${icon("video")}</span>
          <strong>${esc(L(isUp?{sk:"Žiadne naplánované konzultácie",en:"No upcoming consultations"}:{sk:"Zatiaľ žiadne záznamy",en:"No past sessions yet"}))}</strong>
          <p class="small muted">${esc(L(isUp?{sk:"Objednajte sa na videokonzultáciu cez online systém.",en:"Book a video consultation through the online booking system."}:{sk:"Tu sa zobrazia záznamy po absolvovaní konzultácie.",en:"Records will appear here after your first consultation."}))}</p>
          <a href="objednanie.html?mode=telehealth" class="btn btn-primary btn-sm">${icon("calendar")} ${esc(L({sk:"Objednať konzultáciu",en:"Book consultation"}))}</a></div>`
      : tcSessions.map(s => isUp
        ? `<div class="tc-card">
            <div class="tc-card-head"><span class="tc-icon">${icon("video")}</span>
              <div class="tc-info"><strong>${esc(s.physician)}</strong><span class="small muted">${esc(L(s.specialty))} · ${esc(fmtDateTime(s.scheduledAt))}</span></div>
              <span class="badge badge-blue"><span class="dot"></span>${esc(L({sk:"Naplánovaná",en:"Scheduled"}))}</span></div>
            <div class="tc-actions">
              ${cdLbl(s.scheduledAt)&&!joinable(s.scheduledAt)?`<span class="tc-countdown">${icon("clock")} ${esc(cdLbl(s.scheduledAt))}</span>`:""}
              <a href="teleconsult.html" class="btn btn-primary btn-sm${joinable(s.scheduledAt)?"":" tc-disabled"}"${joinable(s.scheduledAt)?"":" aria-disabled='true' tabindex='-1'"} title="${esc(!joinable(s.scheduledAt)?L({sk:"Aktívne 10 min pred termínom",en:"Activates 10 min before appointment"}):"")}"
              >${icon("video")} ${esc(L({sk:"Pripojiť sa",en:"Join"}))}</a>
              <a href="objednanie.html" class="btn btn-ghost btn-sm">${esc(L({sk:"Zrušiť",en:"Cancel"}))}</a>
            </div></div>`
        : `<div class="tc-card">
            <div class="tc-card-head"><span class="tc-icon tc-icon-past">${icon("video")}</span>
              <div class="tc-info"><strong>${esc(s.physician)}</strong><span class="small muted">${esc(L(s.specialty))} · ${esc(fmtDateTime(s.scheduledAt))}</span></div>
              <span class="badge badge-gray">${esc(L({sk:"Ukončená",en:"Ended"}))} · ${s.duration||0} min</span></div>
            <div class="tc-actions">
              <button class="btn btn-ghost btn-sm" data-toggleid="${esc(s.id)}" onclick="toggleSummary('${esc(s.id)}')">${icon("doc")} ${esc(L({sk:"Zobraziť záver",en:"View summary"}))}</button>
              <button class="btn btn-ghost btn-sm" onclick="downloadPdf('${esc(s.id)}')">${icon("download")} PDF</button>
            </div>
            <div class="tc-summary" id="sum-${esc(s.id)}" style="display:none">
              <div class="tc-summary-body">
                <p class="small mb-1"><strong>${esc(L({sk:"Záver konzultácie",en:"Consultation summary"}))}</strong></p>
                <p class="small muted mb-0">${esc(L(s.summary||{sk:"—",en:"—"}))}</p>
                ${s.prescription?`<p class="small mt-1 mb-0">${icon("pill")} ${esc(L({sk:"e-Recept",en:"e-Prescription"}))}: <strong style="color:var(--blue-700)">${esc(s.prescription)}</strong></p>`:""}
              </div></div></div>`
      ).join("");
    v.innerHTML = `
      <div class="card">
        <div class="sec-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span>${esc(L({sk:"Telekonzultácie",en:"Teleconsultations"}))}</span>
          <div class="tc-tabs">${tabBtnTc("upcoming",{sk:"Nadchádzajúce",en:"Upcoming"})}<span class="tc-tab-count">${TELECONSULTS.upcoming.length}</span>${tabBtnTc("past",{sk:"Absolvované",en:"Past"})}</div>
        </div>
        <div class="tc-list">${tcCards}</div>
      </div>
      <div class="card card-pad mt-3 tc-cta">
        <div class="flex-center gap">${icon("video")}<div><strong>${esc(L({sk:"Objednať ďalšiu konzultáciu",en:"Book another consultation"}))}</strong><p class="small muted mb-0">${esc(L({sk:"Videohovor s lekárom — z pohodlia domova.",en:"Video call with your doctor from home."}))}</p></div></div>
        <a href="objednanie.html?mode=telehealth" class="btn btn-primary btn-sm">${icon("calendar")} ${esc(L({sk:"Objednať",en:"Book"}))}</a>
      </div>`;
  }
  else if (view === "wearables") {
    const wShowAdd = sessionStorage.getItem("ns_wr_add") === "1";
    const wCatTab  = sessionStorage.getItem("ns_wr_cat") || "medical";
    const allReadings = WEARABLES.devices
      .flatMap(d => d.readings.map(r => ({...r, dBrand:d.brand})))
      .sort((a,b) => new Date(b.time) - new Date(a.time));
    const deviceCards = WEARABLES.devices.map(d => `
      <div class="wr-device-card">
        <div class="wr-device-head">
          <div class="wr-device-icon wr-icon-${esc(d.category)}">${icon(d.icon)}</div>
          <div class="wr-device-meta">
            <strong>${esc(d.brand)}</strong>
            <span class="small muted">${esc(d.model)}</span>
          </div>
          <span class="badge badge-green"><span class="dot"></span>${esc(L({sk:"Aktívne",en:"Active"}))}</span>
        </div>
        <div class="wr-readings-mini">
          ${d.readings.slice(0,2).map(r =>
            `<div class="wr-mini-row"><span class="small muted">${esc(L(r.metric))}</span><span class="wr-mini-val${r.flag==="high"?" wr-val-high":""}">${esc(r.value)}${r.unit?` <span class="wr-unit">${esc(r.unit)}</span>`:""}</span></div>`
          ).join("")}
        </div>
        <div class="wr-device-foot">
          <span class="small muted" style="display:flex;align-items:center;gap:5px">${icon("sync")} ${esc(fmtAgo(d.lastSync))}</span>
          <label class="wr-share-lbl"><input type="checkbox" checked onchange="return false"><span class="small">${esc(L({sk:"Zdieľať s lekárom",en:"Share with physician"}))}</span></label>
        </div>
      </div>`).join("");
    const readingRows = allReadings.map(r => `
      <div class="wr-tl-row">
        <div class="wr-tl-time">${esc(fmtAgo(r.time))}</div>
        <div class="wr-tl-dot${r.flag==="high"?" wr-tl-dot-hi":""}"></div>
        <div class="wr-tl-body">
          <span class="wr-tl-metric">${esc(L(r.metric))}</span>
          <span class="wr-tl-val${r.flag==="high"?" wr-val-high":""}">${esc(r.value)}${r.unit?" "+esc(r.unit):""}</span>
          <span class="chip">${esc(r.dBrand)}</span>
          ${r.flag==="high"?`<span class="badge badge-amber">${esc(L({sk:"Zvýšené",en:"High"}))}</span>`:`<span class="badge badge-green">${esc(L({sk:"V norme",en:"Normal"}))}</span>`}
        </div>
      </div>`).join("");
    const availCards = WEARABLES.available.filter(x => x.category === wCatTab).map(d => `
      <button class="wr-avail-btn" onclick="alert('${esc(L({sk:"Demo: Prepojenie "+d.brand+" bude dostupné v produkcii.",en:"Demo: "+d.brand+" integration will be available in production."}))}')"> 
        <div class="wr-avail-ic">${esc(d.brand.slice(0,2).toUpperCase())}</div>
        <div>
          <div class="wr-avail-brand">${esc(d.brand)}</div>
          <div class="small muted">${esc(d.model)}</div>
        </div>
      </button>`).join("");
    v.innerHTML = `
      <div class="card">
        <div class="sec-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <div class="flex-center gap-sm">${icon("watch")} <span>${esc(L({sk:"Nositeľné zariadenia",en:"Wearables & Devices"}))}</span> <span class="badge badge-gray">${esc(L({sk:"Voliteľné",en:"Optional"}))}</span></div>
          <button class="btn btn-primary btn-sm" onclick="sessionStorage.setItem('ns_wr_add',sessionStorage.getItem('ns_wr_add')==='1'?'0':'1');renderView()">${icon("bluetooth")} ${esc(L({sk:"Pripojiť zariadenie",en:"Connect device"}))}</button>
        </div>
        <div class="wr-devices-grid">${deviceCards}</div>
      </div>
      <div class="card mt-3">
        <div class="sec-head flex-center gap-sm" style="font-weight:700">${icon("activity")} <span>${esc(L({sk:"Posledné merania",en:"Recent readings"}))}</span></div>
        <div class="wr-timeline">${readingRows}</div>
      </div>
      ${wShowAdd ? `
      <div class="card mt-3">
        <div class="sec-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span>${esc(L({sk:"Pripojiť zariadenie",en:"Connect a device"}))}</span>
          <div class="tc-tabs">
            <button class="tc-tab${wCatTab==="medical"?" active":""}" onclick="sessionStorage.setItem('ns_wr_cat','medical');renderView()">${icon("heart")} ${esc(L({sk:"Medicínske",en:"Medical"}))}</button>
            <button class="tc-tab${wCatTab==="consumer"?" active":""}" onclick="sessionStorage.setItem('ns_wr_cat','consumer');renderView()">${icon("watch")} Fitness &amp; Wellness</button>
          </div>
        </div>
        <div class="wr-avail-grid">${availCards}</div>
      </div>` : ""}
      <div class="wr-privacy mt-3">
        ${icon("shield")}
        <p class="small mb-0">${esc(L({sk:"Prepojenie nositeľných zariadení je plne voliteľné. Dáta sú zdieľané výlučne s vaším ošetrujúcim lekárom — nikdy tretím stranám. Súhlas môžete kedykoľvek odvolať.",en:"Wearable integration is fully optional. Data is shared exclusively with your treating physician — never to third parties. You may withdraw consent at any time."}))}</p>
      </div>
    `;
  }
}
function sectionCard(title, inner) {
  return `<div class="card"><div class="sec-head">${esc(title)}</div><div class="sec-body">${inner}</div></div>`;
}
function initials(n){ return n.replace(/MUDr\.|Mgr\.|Bc\.|MBA|,/g,"").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase(); }

// ---- S9: Teleconsultations ----
ICON.video = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;

// Prototype data — production: GET /telehealth/sessions?patient=me
const TELECONSULTS = {
  upcoming: [
    { id:"th-001", scheduledAt:new Date(Date.now()+2*86400000+8*3600000).toISOString(), physician:"MUDr. Jana Borščová", specialty:{sk:"Interná ambulancia",en:"Internal Medicine Clinic"}, status:"scheduled" },
    { id:"th-002", scheduledAt:new Date(Date.now()+7*86400000+9*3600000).toISOString(), physician:"MUDr. Natália Kyjovská", specialty:{sk:"FRO — Rehabilitácia",en:"Physiatry & Rehabilitation"}, status:"scheduled" }
  ],
  past: [
    { id:"th-003", scheduledAt:"2024-10-05T10:30:00", physician:"MUDr. Jana Borščová", specialty:{sk:"Interná ambulancia",en:"Internal Medicine Clinic"}, status:"ended", duration:18, summary:{sk:"Stabilizovaný stav, pokračovanie v liečbe. Odporúčaná kontrola za 3 mesiace.",en:"Stable condition, continue current treatment. Follow-up recommended in 3 months."}, prescription:"Amlodipín 10 mg" },
    { id:"th-004", scheduledAt:"2024-09-12T09:00:00", physician:"MUDr. Natália Kyjovská", specialty:{sk:"FRO — Rehabilitácia",en:"Physiatry & Rehabilitation"}, status:"ended", duration:24, summary:{sk:"Rehabilitačný program aktualizovaný. Nové cvičenia pridané do individuálneho plánu.",en:"Rehabilitation programme updated. New exercises added to individual plan."} }
  ]
};

// ---- Wearables & Remote Monitoring ----
ICON.watch     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="10" height="14" rx="3"/><path d="M9 5V3h6v2M9 19v2h6v-2"/><line x1="12" y1="9" x2="12" y2="12"/><line x1="12" y1="12" x2="14" y2="14"/></svg>`;
ICON.glucose   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`;
ICON.bluetooth = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>`;

function fmtAgo(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 60000) return L({sk:"práve teraz",en:"just now"});
  if (ms < 3600000) { const m=Math.floor(ms/60000); return L({sk:"pred "+m+" min",en:m+" min ago"}); }
  if (ms < 86400000) { const h=Math.floor(ms/3600000); return L({sk:"pred "+h+" h",en:h+" h ago"}); }
  const d=Math.floor(ms/86400000); return L({sk:"pred "+d+" dňami",en:d+" days ago"});
}

function fmtDateTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso;
  const lang = getLang();
  return d.toLocaleDateString(lang==="sk"?"sk-SK":"en-GB",{day:"numeric",month:"short",year:"numeric"}) + " · " + d.toLocaleTimeString(lang==="sk"?"sk-SK":"en-GB",{hour:"2-digit",minute:"2-digit"});
}
function toggleSummary(id) {
  const el = document.getElementById("sum-"+id); if (!el) return;
  const open = el.style.display !== "none";
  el.style.display = open ? "none" : "block";
  const btn = document.querySelector('[data-toggleid="'+id+'"]');
  if (btn) btn.innerHTML = icon("doc") + " " + esc(open ? L({sk:"Zobraziť záver",en:"View summary"}) : L({sk:"Skryť záver",en:"Hide summary"}));
}
function downloadPdf(id) {
  const code = prompt(L({sk:"Overenie totožnosti — zadajte SMS kód (demo: 1234):",en:"Identity check — enter SMS code (demo: 1234):"}));
  if (code === null) return;
  code === "1234" ? alert(L({sk:"Súhrn konzultácie sa sťahuje (PDF).",en:"Downloading consultation summary (PDF)."})) : alert(L({sk:"Nesprávny kód. Prístup zamietnutý.",en:"Invalid code. Access denied."}));
}
