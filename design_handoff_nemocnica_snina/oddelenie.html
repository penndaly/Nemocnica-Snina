<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddelenie — Nemocnica Snina</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="siteHeader"></header>
<main id="main"></main>
<footer id="siteFooter"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
Site.mount({ active: "departments" });
const depIcons = { chirurgia:"scalpel", interne:"pulse", gynekologia:"heart", pediatria:"baby", oaim:"shield", fro:"activity", neonatologia:"baby" };
const params = new URLSearchParams(location.search);
const id = params.get("id");
const d = DB.find("departments", id);
const main = document.getElementById("main");

if (!d) {
  main.innerHTML = `<section class="section"><div class="container text-center">
    <h1>${esc(L({sk:"Oddelenie sa nenašlo",en:"Department not found"}))}</h1>
    <a href="oddelenia.html" class="btn btn-primary mt-2">${icon("arrowLeft")} ${esc(t("nav.departments"))}</a>
  </div></section>`;
} else {
  const lead = typeof d.lead === 'string' ? d.lead : L(d.lead);
  const relClinics = DB.list("clinics").filter(c => (c.doctor||"").includes(lead) || c.id === id);
  const relDocs = DB.list("physicians").filter(p => p.dept === id);
  const facilities = (d.facilities && (d.facilities.sk || d.facilities.en)) ? L(d.facilities) : [];

  main.innerHTML = `
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">${esc(t("backHome"))}</a><span>/</span>
        <a href="oddelenia.html">${esc(t("nav.departments"))}</a><span>/</span>
        <span>${esc(L(d.short))}</span>
      </div>
      <div class="dept-hero">
        <div>
          <span class="dept-icon-lg">${icon(depIcons[id]||"activity")}</span>
          <h1>${esc(L(d.name))}</h1>
          <p class="lede" style="max-width:60ch">${esc(L(d.summary))}</p>
          <div class="flex gap wrap mt-2">
            ${d.beds ? `<span class="chip">${icon("building")} ${d.beds} ${esc(t("beds"))}</span>` : ``}
            <span class="chip">${icon("user")} ${esc(lead)}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container detail-grid">
      <div class="detail-main">
        <div class="ph ph-16x9 mb-3" data-label="${esc(L({sk:'fotografia oddelenia / priestorov',en:'department / facility photo'}))}"></div>
        <h2>${esc(L({sk:"O oddelení",en:"About the department"}))}</h2>
        <p class="lede" style="font-size:1.08rem">${esc(L(d.desc))}</p>

        ${facilities.length ? `
        <h3 class="mt-4">${esc(L({sk:"Vybavenie a služby",en:"Facilities & services"}))}</h3>
        <div class="feature-list">
          ${facilities.map(f => `<div class="feature-item">${icon("check")} <span>${esc(f)}</span></div>`).join("")}
        </div>` : ``}

        ${relDocs.length ? `
        <h3 class="mt-4">${esc(t("nav.doctors"))}</h3>
        <div class="grid grid-2">
          ${relDocs.map(p => `
            <a href="lekari.html#${p.id}" class="card card-pad flex-center gap doc-mini">
              <span class="avatar">${esc(initials(p.name))}</span>
              <div>
                <h4 class="mb-0" style="font-size:1rem">${esc(p.name)}</h4>
                <span class="small muted">${esc(L(p.role))}</span>
                ${p.accepting ? `<div class="mt-1"><span class="badge badge-green"><span class="dot"></span>${esc(t("accepting"))}</span></div>` : ``}
              </div>
            </a>`).join("")}
        </div>` : ``}
      </div>

      <aside class="detail-side">
        <div class="card card-pad side-card">
          <h4>${esc(L({sk:"Kontakt a informácie",en:"Contact & information"}))}</h4>
          <div class="side-rows">
            ${d.phone ? `<div class="icon-row">${icon("phone")}<div><b>${esc(d.phone)}</b><br><span class="small muted">${esc(t("phone"))}</span></div></div>` : ``}
            ${d.delivery ? `<div class="icon-row">${icon("baby")}<div><b>${esc(d.delivery)}</b><br><span class="small muted">${esc(L({sk:"Pôrodná sála",en:"Delivery room"}))}</span></div></div>` : ``}
            ${d.email ? `<div class="icon-row">${icon("doc")}<div><a href="mailto:${esc(d.email)}">${esc(d.email)}</a></div></div>` : ``}
            <div class="icon-row">${icon("user")}<div><b>${esc(lead)}</b><br><span class="small muted">${esc(typeof d.leadRole==='object'?L(d.leadRole):t("head"))}</span></div></div>
            ${d.deputy ? `<div class="icon-row">${icon("users")}<div><b>${esc(d.deputy)}</b><br><span class="small muted">${esc(d.deputyRole?L(d.deputyRole):L({sk:"Zástupca",en:"Deputy"}))}</span></div></div>` : ``}
            ${d.visiting ? `<div class="icon-row">${icon("clock")}<div><b>${esc(L({sk:"Návštevné hodiny",en:"Visiting hours"}))}</b><br><span class="small muted">${esc(L(d.visiting))}</span></div></div>` : ``}
          </div>
          <a href="objednanie.html" class="btn btn-primary btn-block mt-3">${icon("calendar")} ${esc(t("book"))}</a>
          <a href="kontakt.html" class="btn btn-ghost btn-block mt-2">${icon("pin")} ${esc(L({sk:"Ako sa k nám dostať",en:"How to find us"}))}</a>
        </div>
      </aside>
    </div>
  </section>`;
}

function initials(n){ return n.replace(/MUDr\.|Mgr\.|Bc\.|MBA|,/g,"").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase(); }
</script>

<style>
.dept-hero { display:flex; gap:30px; }
.dept-icon-lg { display:inline-flex; width:58px;height:58px;border-radius:14px;background:var(--terra-50);color:var(--terra);align-items:center;justify-content:center;margin-bottom:14px; }
.dept-icon-lg svg { width:32px;height:32px; }
.detail-grid { display:grid; grid-template-columns: 1.6fr .9fr; gap:44px; align-items:start; }
.feature-list { display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; margin-top:14px; }
.feature-item { display:flex; gap:10px; align-items:flex-start; }
.feature-item svg { width:20px;height:20px;color:var(--green);flex:0 0 auto;margin-top:2px; }
.doc-mini { display:flex; }
.side-card { position:sticky; top:96px; border-top:4px solid var(--blue-600); }
.side-rows .icon-row { padding:10px 0; border-bottom:1px solid var(--line); margin-bottom:0; }
.side-rows .icon-row:last-child { border-bottom:none; }
@media (max-width:940px){ .detail-grid{grid-template-columns:1fr;} .feature-list{grid-template-columns:1fr;} .side-card{position:static;} }
</style>
<script src="assets/image-slot.js"></script>
<script src="assets/media.js"></script>
</body>
</html>
