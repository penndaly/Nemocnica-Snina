<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objednať termín — Nemocnica Snina</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="siteHeader"></header>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html" id="bcHome"></a><span>/</span><span id="bcHere"></span></div>
      <p class="eyebrow" id="phEyebrow"></p>
      <h1 id="phTitle"></h1>
      <div class="stepper mt-2" id="stepper"></div>
    </div>
  </section>

  <section class="section">
    <div class="container container-narrow" id="stage"></div>
  </section>
</main>
<footer id="siteFooter"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
Site.mount({ active: "" });
document.getElementById("bcHome").textContent = t("backHome");
document.getElementById("bcHere").textContent = t("book");
document.getElementById("phEyebrow").textContent = L({sk:"Online objednanie",en:"Online booking"});
document.getElementById("phTitle").textContent = L({sk:"Objednať termín",en:"Book an appointment"});

const DAY_NAMES = { sk:["Ne","Po","Ut","St","Št","Pi","So"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"] };
const params = new URLSearchParams(location.search);
const bookable = DB.list("clinics").filter(c => c.bookable);
const state = { step: 1, clinic: null, date: null, time: null, ref: false };
if (params.get("clinic")) { const c = DB.find("clinics", params.get("clinic")); if (c && c.bookable) { state.clinic = c; state.step = 2; } }

const STEPS = [
  {sk:"Ambulancia",en:"Clinic"},
  {sk:"Dátum",en:"Date"},
  {sk:"Čas",en:"Time"},
  {sk:"Údaje",en:"Details"},
  {sk:"Potvrdenie",en:"Confirm"}
];

function renderStepper() {
  document.getElementById("stepper").innerHTML = STEPS.map((s,i) => {
    const n = i+1; const cls = n<state.step?"done":(n===state.step?"active":"");
    return `<div class="step ${cls}"><span class="step-num">${n<state.step?icon("check"):n}</span><span class="step-lbl">${esc(L(s))}</span></div>`;
  }).join('<span class="step-line"></span>');
}

function upcomingDates(days, n) {
  const out = []; const today = new Date(); today.setHours(0,0,0,0);
  let d = new Date(today); d.setDate(d.getDate()+1);
  let guard = 0;
  while (out.length < n && guard < 60) {
    if (!days || days.includes(d.getDay())) out.push(new Date(d));
    d.setDate(d.getDate()+1); guard++;
  }
  return out;
}
function slotsFor(clinic) {
  // simple slot generation respecting a morning clinic window
  const base = ["07:30","08:15","09:00","09:45","10:30","11:15","13:00","13:45","14:15"];
  if (clinic.id === "urazova-chirurgia") return ["09:15","10:00","10:45","11:30","12:15","13:00"];
  if (clinic.id === "angiologicka") return ["07:30","08:15","09:00","10:00","11:00","13:30"];
  return base;
}

function render() {
  renderStepper();
  const stage = document.getElementById("stage");

  if (state.step === 1) {
    stage.innerHTML = `
      <h2>${esc(L({sk:"Vyberte ambulanciu",en:"Choose a clinic"}))}</h2>
      <p class="muted mb-3">${esc(L({sk:"Zobrazujeme len ambulancie s dostupným online objednávaním.",en:"Showing only clinics with online booking available."}))}</p>
      <div class="flex-col gap">
        ${bookable.map(c => `
          <button class="select-row" data-id="${c.id}">
            <div>
              <div class="flex-center gap-sm mb-1">${statusBadge(c.status)} ${c.referral?`<span class="chip" style="color:var(--amber)">${icon("doc")} ${esc(t("referralReq"))}</span>`:``}</div>
              <h4 class="mb-0">${esc(L(c.name))}</h4>
              <span class="small muted">${esc(c.doctor||"")} · ${esc(L(c.location))}</span>
            </div>
            ${icon("chevron")}
          </button>`).join("")}
      </div>`;
    stage.querySelectorAll(".select-row").forEach(b => b.onclick = () => { state.clinic = DB.find("clinics", b.dataset.id); state.step = 2; render(); });
  }

  else if (state.step === 2) {
    const c = state.clinic;
    const dates = upcomingDates(c.bookingDays, 8);
    const lang = getLang();
    stage.innerHTML = `
      ${backBtn(1)}
      ${clinicBanner(c)}
      <h2 class="mt-3">${esc(L({sk:"Vyberte dátum",en:"Choose a date"}))}</h2>
      <div class="rule-note mb-3">${icon("alert")} <span>${esc(L(c.bookingRule))}</span></div>
      <div class="date-grid">
        ${dates.map(d => {
          const iso = d.toISOString().slice(0,10);
          return `<button class="date-cell" data-d="${iso}">
            <span class="dc-day">${DAY_NAMES[lang][d.getDay()]}</span>
            <span class="dc-num">${d.getDate()}</span>
            <span class="dc-mon">${d.toLocaleDateString(lang==='sk'?'sk-SK':'en-GB',{month:'short'})}</span>
          </button>`;
        }).join("")}
      </div>
      ${dates.length===0?`<p class="muted">${esc(L({sk:"V najbližšom období nie sú dostupné dni na objednanie.",en:"No bookable days available soon."}))}</p>`:``}`;
    stage.querySelectorAll(".date-cell").forEach(b => b.onclick = () => { state.date = b.dataset.d; state.step = 3; render(); });
    bindBack();
  }

  else if (state.step === 3) {
    const c = state.clinic;
    const slots = slotsFor(c);
    stage.innerHTML = `
      ${backBtn(2)}
      ${clinicBanner(c)}
      <h2 class="mt-3">${esc(L({sk:"Vyberte čas",en:"Choose a time"}))}</h2>
      <p class="muted mb-2">${esc(fmtDateLong(state.date))} ${c.bookingWindow?`· ${esc(L({sk:"objednávacie okno",en:"booking window"}))} ${c.bookingWindow}`:''}</p>
      <div class="slot-grid">
        ${slots.map(s => `<button class="slot" data-t="${s}">${s}</button>`).join("")}
      </div>`;
    stage.querySelectorAll(".slot").forEach(b => b.onclick = () => { state.time = b.dataset.t; state.step = 4; render(); });
    bindBack();
  }

  else if (state.step === 4) {
    const c = state.clinic;
    stage.innerHTML = `
      ${backBtn(3)}
      ${clinicBanner(c)}
      <h2 class="mt-3">${esc(L({sk:"Vaše údaje",en:"Your details"}))}</h2>
      <form id="form" class="form-card card card-pad">
        <div class="grid grid-2">
          <label class="field"><span>${esc(L({sk:"Meno a priezvisko",en:"Full name"}))}</span><input type="text" required></label>
          <label class="field"><span>${esc(L({sk:"Rodné číslo",en:"National ID"}))}</span><input type="text" placeholder="RRMMDD/XXXX" required></label>
          <label class="field"><span>${esc(L({sk:"Telefón",en:"Phone"}))}</span><input type="tel" placeholder="+421 9XX XXX XXX" required></label>
          <label class="field"><span>${esc(L({sk:"Zdravotná poisťovňa",en:"Insurer"}))}</span>
            <select><option>VšZP (25)</option><option>Dôvera (24)</option><option>Union (27)</option><option>${esc(L({sk:"Samoplatca",en:"Self-pay"}))}</option></select>
          </label>
        </div>
        <label class="field"><span>${esc(L({sk:"Dôvod návštevy (nepovinné)",en:"Reason for visit (optional)"}))}</span><textarea rows="2"></textarea></label>
        ${c.referral?`<label class="consent"><input type="checkbox" required><span>${esc(L({sk:"Mám platný výmenný lístok (odporúčanie) na toto vyšetrenie.",en:"I have a valid referral (výmenný lístok) for this examination."}))}</span></label>`:``}
        <label class="consent"><input type="checkbox" required><span>${esc(L({sk:"Súhlasím so spracovaním osobných a zdravotných údajov v zmysle GDPR (čl. 9).",en:"I consent to processing of my personal and health data under GDPR (Art. 9)."}))}</span></label>
        <button type="submit" class="btn btn-primary btn-lg btn-block mt-2">${icon("check")} ${esc(L({sk:"Potvrdiť rezerváciu",en:"Confirm booking"}))}</button>
      </form>`;
    document.getElementById("form").onsubmit = (e) => { e.preventDefault(); state.step = 5; state.bookingId = genId(); render(); };
    bindBack();
  }

  else if (state.step === 5) {
    const c = state.clinic;
    stage.innerHTML = `
      <div class="card success-card text-center">
        <span class="success-ic">${icon("check")}</span>
        <h2>${esc(L({sk:"Rezervácia potvrdená",en:"Booking confirmed"}))}</h2>
        <p class="muted">${esc(L({sk:"Potvrdenie a pripomienku odošleme cez SMS. Termín môžete zrušiť odkazom v SMS.",en:"We'll send confirmation and a reminder by SMS. You can cancel via the SMS link."}))}</p>
        <div class="confirm-box">
          <div class="cb-row"><span>${esc(L({sk:"Číslo rezervácie",en:"Booking ID"}))}</span><b>${esc(state.bookingId)}</b></div>
          <div class="cb-row"><span>${esc(L({sk:"Ambulancia",en:"Clinic"}))}</span><b>${esc(L(c.name))}</b></div>
          <div class="cb-row"><span>${esc(L({sk:"Dátum a čas",en:"Date & time"}))}</span><b>${esc(fmtDateLong(state.date))} · ${esc(state.time)}</b></div>
          <div class="cb-row"><span>${esc(L({sk:"Miesto",en:"Location"}))}</span><b>${esc(L(c.location))}</b></div>
        </div>
        <div class="flex gap wrap mt-3" style="justify-content:center">
          <a href="index.html" class="btn btn-ghost">${icon("arrowLeft")} ${esc(t("backHome"))}</a>
          <a href="portal.html" class="btn btn-primary">${icon("user")} ${esc(t("portal"))}</a>
        </div>
      </div>`;
  }
}

function backBtn(to){ return `<button class="link-back" data-to="${to}">${icon("arrowLeft")} ${esc(L({sk:"Späť",en:"Back"}))}</button>`; }
function bindBack(){ const b=document.querySelector(".link-back"); if(b) b.onclick=()=>{ state.step=parseInt(b.dataset.to,10); render(); }; }
function clinicBanner(c){ return `<div class="clinic-banner"><span class="cb-ic">${icon("stethoscope")}</span><div><h4 class="mb-0">${esc(L(c.name))}</h4><span class="small muted">${esc(c.doctor||"")} · ${esc(L(c.location))}</span></div>${statusBadge(c.status)}</div>`; }
function fmtDateLong(iso){ const d=new Date(iso); const lang=getLang(); return d.toLocaleDateString(lang==='sk'?'sk-SK':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function genId(){ return "NS-" + Math.random().toString(36).slice(2,7).toUpperCase(); }
render();
</script>

<style>
.stepper { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.step { display:flex; align-items:center; gap:9px; }
.step-num { width:30px;height:30px;border-radius:50%;background:var(--warm-200);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex:0 0 auto; }
.step-num svg{width:16px;height:16px;}
.step-lbl { font-weight:700; font-size:.9rem; color:var(--ink-3); }
.step.active .step-num { background:var(--blue-700); color:#fff; }
.step.active .step-lbl { color:var(--ink); }
.step.done .step-num { background:var(--green); color:#fff; }
.step.done .step-lbl { color:var(--ink-2); }
.step-line { flex:1; height:2px; background:var(--line); min-width:8px; max-width:36px; }
.select-row { display:flex; justify-content:space-between; align-items:center; gap:16px; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; cursor:pointer; transition:all .15s; font-family:inherit; }
.select-row:hover { border-color:var(--blue-500); box-shadow:var(--shadow); transform:translateY(-2px); }
.select-row svg{width:22px;height:22px;color:var(--blue-300);flex:0 0 auto;}
.clinic-banner { display:flex; gap:14px; align-items:center; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px; }
.cb-ic { display:inline-flex;width:42px;height:42px;border-radius:11px;background:var(--surface);color:var(--blue-700);align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow-sm); }
.cb-ic svg{width:23px;height:23px;}
.clinic-banner .badge { margin-left:auto; }
.rule-note { display:flex; gap:10px; align-items:flex-start; background:var(--blue-50); border:1px solid var(--blue-100); border-radius:var(--radius-sm); padding:12px 14px; font-size:.92rem; color:var(--blue-900); }
.rule-note svg { width:18px;height:18px;flex:0 0 auto;color:var(--blue-600);margin-top:1px; }
.date-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.date-cell { display:flex; flex-direction:column; align-items:center; gap:2px; padding:16px 8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; transition:all .14s; font-family:inherit; }
.date-cell:hover { border-color:var(--blue-500); background:var(--blue-50); transform:translateY(-2px); }
.dc-day { font-size:.78rem; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
.dc-num { font-family:'Newsreader',serif; font-size:1.7rem; font-weight:600; color:var(--ink); line-height:1; }
.dc-mon { font-size:.78rem; color:var(--ink-3); }
.slot-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px; }
.slot { padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); font-weight:700; font-size:1.05rem; color:var(--ink); cursor:pointer; transition:all .14s; font-family:inherit; }
.slot:hover { border-color:var(--blue-600); background:var(--blue-700); color:#fff; transform:translateY(-2px); }
.consent { display:flex; gap:11px; align-items:flex-start; font-size:.9rem; color:var(--ink-2); margin:10px 0; cursor:pointer; }
.consent input { width:18px;height:18px;margin-top:2px;accent-color:var(--blue-600);flex:0 0 auto; }
.link-back { background:none; border:none; color:var(--blue-700); font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:5px; margin-bottom:16px; font-family:inherit; font-size:.95rem; padding:0; }
.link-back svg{width:18px;height:18px;}
.success-card { padding:44px; border-top:5px solid var(--green); max-width:560px; margin:0 auto; }
.success-ic { display:inline-flex;width:72px;height:72px;border-radius:50%;background:var(--green-50);color:var(--green);align-items:center;justify-content:center;margin-bottom:8px; }
.success-ic svg{width:40px;height:40px;}
.confirm-box { text-align:left; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius); padding:8px 20px; margin-top:18px; }
.cb-row { display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px dashed var(--line-2); font-size:.95rem; }
.cb-row:last-child{border-bottom:none;}
.cb-row span{color:var(--ink-3);}
@media (max-width:560px){ .date-grid{grid-template-columns:repeat(3,1fr);} .step-lbl{display:none;} }
</style>
<script src="assets/image-slot.js"></script>
<script src="assets/media.js"></script>
<script src="assets/placeholder-art.js"></script>
</body>
</html>
