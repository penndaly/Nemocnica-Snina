<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambulancie — Nemocnica Snina</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="siteHeader"></header>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html" id="bcHome"></a><span>/</span><span id="bcHere"></span></div>
      <p class="eyebrow" id="phEyebrow"></p>
      <h1 id="phTitle"></h1>
      <p class="lede" id="phSub" style="max-width:64ch"></p>
      <div class="flex gap wrap mt-2" id="legend"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="flex-col gap-lg" id="list"></div>
    </div>
  </section>
</main>
<footer id="siteFooter"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
Site.mount({ active: "clinics" });
document.getElementById("bcHome").textContent = t("backHome");
document.getElementById("bcHere").textContent = t("nav.clinics");
document.getElementById("phEyebrow").textContent = L({sk:"Ambulantná časť",en:"Outpatient care"});
document.getElementById("phTitle").textContent = L({sk:"Špecializované ambulancie",en:"Specialised clinics"});
document.getElementById("phSub").textContent = L({sk:"Každá ambulancia má vlastné ordinačné hodiny a pravidlá objednávania. Online termíny sú dostupné len tam, kde to prevádzka umožňuje.",en:"Each clinic has its own operating hours and booking rules. Online appointments are available only where the clinic permits."});

document.getElementById("legend").innerHTML = ["open","new","alert","closed"]
  .map(s => statusBadge(s)).join("");

document.getElementById("list").innerHTML = DB.list("clinics").map(c => {
  const sched = L(c.schedule) || [];
  return `
  <div class="card clinic-card reveal" id="${c.id}">
    <div class="clinic-main">
      <div class="flex-between wrap gap-sm mb-1">
        <span class="eyebrow mb-0">${esc(L(c.specialty))}</span>
        ${statusBadge(c.status)}
      </div>
      <h3 class="mb-1">${esc(L(c.name))}</h3>
      <div class="flex gap wrap small muted mb-2">
        ${c.doctor ? `<span class="flex-center gap-sm">${icon("user")} ${esc(c.doctor)}</span>` : ``}
        ${c.nurse ? `<span class="flex-center gap-sm">${icon("users")} ${esc(c.nurse)}</span>` : ``}
      </div>
      <div class="flex gap wrap mb-2">
        <span class="chip">${icon("pin")} ${esc(L(c.location))}</span>
        ${c.phone ? `<span class="chip">${icon("phone")} ${esc(c.phone)}</span>` : ``}
        ${c.referral ? `<span class="chip" style="color:var(--amber)">${icon("doc")} ${esc(t("referralReq"))}</span>` : ``}
      </div>
      <div class="rule-note">${icon("alert")} <span>${esc(L(c.bookingRule))}</span></div>
      ${c.fee ? `<p class="small muted mt-1 mb-0">${esc(L(c.fee))}</p>` : ``}
    </div>
    <div class="clinic-side">
      <div class="sched-box">
        <span class="small" style="font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink-2)">${icon("clock")} ${esc(t("schedule"))}</span>
        <div class="mt-1">
          ${sched.map(s => `<div class="sched-row">${esc(s)}</div>`).join("")}
        </div>
      </div>
      ${c.bookable
        ? `<a href="objednanie.html?clinic=${c.id}" class="btn btn-primary btn-block mt-2">${icon("calendar")} ${esc(t("bookHere"))}</a>`
        : `<button class="btn btn-ghost btn-block mt-2" disabled style="opacity:.6;cursor:not-allowed">${esc(L({sk:"Online objednanie nedostupné",en:"Online booking unavailable"}))}</button>`}
    </div>
  </div>`;
}).join("");
</script>

<style>
.clinic-card { display:grid; grid-template-columns: 1.7fr .9fr; gap:0; overflow:hidden; }
.clinic-main { padding:26px; }
.clinic-side { padding:26px; background:var(--bg-2); border-left:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; }
.sched-box {}
.sched-row { font-size:.9rem; color:var(--ink); padding:5px 0; border-bottom:1px dashed var(--line-2); }
.sched-row:last-child { border-bottom:none; }
.rule-note { display:flex; gap:10px; align-items:flex-start; background:var(--blue-50); border:1px solid var(--blue-100); border-radius:var(--radius-sm); padding:12px 14px; font-size:.9rem; color:var(--blue-900); }
.rule-note svg { width:18px;height:18px;flex:0 0 auto;color:var(--blue-600);margin-top:1px; }
@media (max-width:780px){ .clinic-card{grid-template-columns:1fr;} .clinic-side{border-left:none;border-top:1px solid var(--line);} }
</style>
<script src="assets/image-slot.js"></script>
<script src="assets/media.js"></script>
</body>
</html>
