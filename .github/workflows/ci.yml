name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  # pnpm version comes from the root package.json "packageManager" field —
  # pnpm/action-setup@v4 reads it and errors if a `version` input is also given.

jobs:
  # ── Typecheck ─────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@ns/api exec prisma generate
      - run: pnpm typecheck

  # ── Lint ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ── Unit + Integration tests ──────────────────────────────
  # Postgres runs as nstest (superuser equivalent in CI).
  # After db:push we apply audit-immutability.sql which:
  #   - Creates ns_app role with INSERT-only on audit_log
  #   - Attaches the append-only trigger
  # The audit-immutability.db.test.ts then connects as ns_app
  # and proves UPDATE/DELETE are rejected at the DB layer.
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nstest
          POSTGRES_PASSWORD: nstest
          POSTGRES_DB: nemocnica_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Superuser URL — used by db:push and hardening step
      DATABASE_URL: postgresql://nstest:nstest@localhost:5432/nemocnica_test
      # Application role URL — used by audit immutability test
      DATABASE_URL_APP: postgresql://ns_app:ns_app_ci@localhost:5432/nemocnica_test
      JWT_SECRET: test_secret_for_ci_e2e_pipeline_min32chars
      NS_APP_PASSWORD: ns_app_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1. Create schema (superuser)
      - name: Apply Prisma migrations
        run: pnpm --filter=@ns/api db:push

      # 2. Apply audit immutability (trigger + role separation)
      #    Uses superuser psql to set up ns_app role + trigger.
      #    This is the step that makes the DB enforce immutability.
      - name: Apply audit log immutability
        run: |
          PGPASSWORD=nstest psql \
            -h localhost -U nstest -d nemocnica_test \
            -v NS_APP_PASSWORD="$NS_APP_PASSWORD" \
            -f infra/postgres/audit-immutability.sql

      # 3–5 each report independently: `if: always()` means one of these
      # failing (e.g. the known timezone-sensitive booking-date flakiness in
      # step 4) no longer skips the others — GitHub Actions skips later steps
      # in a job by default once one fails, which was silently hiding
      # DB-level audit immutability test results behind unrelated failures.
      # Setup steps above (migrations, audit-immutability apply) intentionally
      # keep default behavior — if those fail, running tests against a broken
      # DB would just produce confusing noise instead of a real skip.

      # 3. Pure unit tests (no DB required)
      - name: Unit tests (rc-validation, booking-rules)
        if: always()
        run: pnpm --filter=@ns/api test -- --testPathPattern="rc-validation|booking-rules\\.test"

      # 4. HTTP integration tests (Prisma mocked, rules are REAL)
      - name: HTTP integration tests — booking API rule enforcement
        if: always()
        run: pnpm --filter=@ns/api test -- --testPathPattern="booking-api\\.e2e"

      # 5. DB-level audit immutability test (uses ns_app role against real DB)
      - name: DB-level audit immutability test
        if: always()
        run: pnpm --filter=@ns/api test -- --testPathPattern="audit-immutability\\.db"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_APP }}

  # ── Edge-case tests (need real DB; concurrent slot + past date + mismatch) ──
  test-edge:
    name: Test (edge cases — real DB)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nstest
          POSTGRES_PASSWORD: nstest
          POSTGRES_DB: nemocnica_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://nstest:nstest@localhost:5432/nemocnica_test
      JWT_SECRET: test_secret_for_ci_e2e_pipeline_min32chars
      NS_APP_PASSWORD: ns_app_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@ns/api db:push
      - name: Apply audit log immutability
        run: |
          PGPASSWORD=nstest psql -h localhost -U nstest -d nemocnica_test \
            -v NS_APP_PASSWORD="$NS_APP_PASSWORD" \
            -f infra/postgres/audit-immutability.sql
      - name: Edge-case tests (concurrent slot, past date, mismatch)
        run: pnpm --filter=@ns/api test -- --testPathPattern="booking-edge-cases"

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@ns/api exec prisma generate
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.nemocnicasnina.sk
          NEXT_PUBLIC_CMS_URL: https://cms.nemocnicasnina.sk

  # ── Integration smoke test against staging (L2 gate) ──────
  # Runs only on main branch after a successful build.
  # Requires STAGING_* secrets to be set in the repo.
  # All integrations must pass (no mocks) before the E2E suite runs.
  smoke-staging:
    name: Integration smoke — staging
    runs-on: ubuntu-latest
    needs: [build, test, test-edge]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    env:
      APP_BASE_URL:      ${{ secrets.STAGING_APP_URL }}
      API_BASE_URL:      ${{ secrets.STAGING_API_URL }}
      STRAPI_URL:        ${{ secrets.STAGING_STRAPI_URL }}
      STRAPI_API_TOKEN:  ${{ secrets.STAGING_STRAPI_TOKEN }}
      SMOKE_ADMIN_JWT:   ${{ secrets.STAGING_ADMIN_JWT }}
      SMOKE_SMS_PHONE:   ${{ secrets.STAGING_SMOKE_PHONE }}
      OIDC_ISSUER_URL:   ${{ secrets.STAGING_OIDC_ISSUER }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write GCP credentials
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> $GITHUB_ENV
      - name: Run integration smoke tests
        run: npx ts-node --project tsconfig.base.json scripts/smoke-test.ts

  # ── E2E tests (Playwright, SPEC 1–9) ──────────────────────
  # Runs after smoke-staging on main; also runs on PRs against a local stack.
  e2e:
    name: E2E — sk / en / mobile + axe
    runs-on: ubuntu-latest
    needs: [test, test-edge]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nstest
          POSTGRES_PASSWORD: nstest
          POSTGRES_DB: nemocnica_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3-management-alpine
        options: --health-cmd "rabbitmq-diagnostics ping" --health-interval 15s --health-retries 5
        ports: ["5672:5672"]
    env:
      DATABASE_URL:     postgresql://nstest:nstest@localhost:5432/nemocnica_test
      REDIS_URL:        redis://localhost:6379
      RABBITMQ_URL:     amqp://guest:guest@localhost:5672
      JWT_SECRET:       test_secret_for_ci_e2e_pipeline_min32chars
      SMS_PROVIDER:     console
      HIS_MOCK_ENABLED: "true"
      OIDC_MOCK_ENABLED: "true"
      OIDC_MOCK_PORT:   "4010"
      APP_BASE_URL:     http://localhost:3000
      API_BASE_URL:     http://localhost:3001
      STRAPI_URL:       http://localhost:1337
      STRAPI_API_TOKEN: dev-token
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NS_APP_PASSWORD: ns_app_ci
      # TELEHEALTH_PROVIDER already defaults to 'mock' on the API side
      # (telehealth.module.ts's provider factory), but the web app's telehealth
      # room page (apps/web/src/app/[lang]/telehealth/konzultacia/[sessionId]/page.tsx)
      # reads NEXT_PUBLIC_TELEHEALTH_PROVIDER directly with no fallback — baked
      # in at build time. Without it, the room page tries a real LiveKit
      # connection to a non-existent wss:// host instead of taking the mock
      # short-circuit path, hanging every telehealth.spec.ts room test.
      TELEHEALTH_PROVIDER: mock
      NEXT_PUBLIC_TELEHEALTH_PROVIDER: mock
      # This job does a real `node dist/main` full-app bootstrap (unlike
      # test/test-edge, which build minimal Nest testing modules and never
      # trigger startup config validation) — these are all-zero-hex-rejected
      # by config.schema.ts's hexSecret() the moment NODE_ENV=production, but
      # this job doesn't set NODE_ENV, so the all-zero dev default should
      # apply... except it didn't reliably in local testing, so setting
      # explicit CI-only values here is both correct and doesn't depend on
      # figuring out why. Fixed, throwaway values — this is an ephemeral CI
      # runner, not a real deployment.
      STAFF_JWT_SECRET:    7adfce29c94b95f41cf252c0cd642d9f98eda34978c1e8d7f0a6dbace8304c30
      STAFF_MFA_SECRET:    2151ad5b4c04e1f0e8e575d1dd765555d4e924d463fa7d15605a49f662d1c28b
      STAFF_TOTP_KEY:      7d6973fc35bc1393a070ba727a7846328649a084e5ce72dff6acfb344dc0105a
      RC_ENCRYPTION_KEY:   a3c4c275157fa44eab73cec7cb7db38303eb045a9f7dbf52635213e67c571baf
      GDPR_EXPORT_KEY:     72e1e587cbeb5c73b104c4ede3fc3db3685dc844a90789efd29ae1d671148160
      WEARABLES_TOKEN_KEY: e17ecb937553296b9e02f15466ff8251eec15e46c8a6a389c7d5c6f743ff8171
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply DB schema + audit hardening
        run: |
          pnpm --filter=@ns/api db:push
          PGPASSWORD=nstest psql -h localhost -U nstest -d nemocnica_test \
            -v NS_APP_PASSWORD="$NS_APP_PASSWORD" \
            -f infra/postgres/audit-immutability.sql

      # This job starts the API/web servers from their production builds
      # (`node dist/main`, `next start`) but never built anything — dist/ and
      # .next/ don't exist in a fresh checkout, so both would fail
      # immediately and "Wait for servers" would just time out. Can't reuse
      # the shared `build` job's output either: Next.js inlines NEXT_PUBLIC_*
      # at build time, and that job bakes in the production API/CMS URLs —
      # this job needs the localhost ones already in its own `env:` block
      # above, so it needs its own build.
      - name: Build API + web for e2e
        run: |
          pnpm --filter=@ns/api exec prisma generate
          pnpm --filter=@ns/api build
          pnpm --filter=@ns/web build

      # webkit as well as chromium — playwright.config.ts has a `mobile`
      # project on iPhone 13, which is WebKit. Installing chromium alone made
      # every mobile-project spec fail to launch a browser.
      - name: Install Playwright browsers
        run: pnpm --filter=@ns/web exec playwright install --with-deps chromium webkit

      - name: Start API server
        run: pnpm --filter=@ns/api start &
        env:
          PORT: 3001

      - name: Start web server
        run: pnpm --filter=@ns/web start &
        env:
          PORT: 3000

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:3000/sk http://localhost:3001/api/health --timeout 60000

      - name: Run E2E tests (sk + en + mobile)
        run: pnpm --filter=@ns/web test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
