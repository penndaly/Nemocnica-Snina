document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

y: swap;\n  src: url(\"61d8728d-65d1-4ee1-9e5f-b5661580a794\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Public Sans',system-ui,sans-serif;color:#26334d;background:#fff;-webkit-font-smoothing:antialiased}\na{color:#1f6f8f}a:hover{color:#16294d}\n.wrap{max-width:1080px;margin:0 auto;padding:0 28px}\n.topbar{max-width:1080px;margin:0 auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}\n.topbar img{height:44px;width:auto;display:block}\n.lang{display:flex;gap:6px}\n.lang button{font:600 12.5px/1 'Sora',sans-serif;letter-spacing:.08em;padding:9px 14px;border-radius:8px;border:1px solid #d8e0ea;background:#fff;color:#5b6982;cursor:pointer}\n.lang button.on{background:#16294d;border-color:#16294d;color:#fff}\nheader.hero{background:#16294d;background-image:radial-gradient(120% 140% at 12% -10%,#1e3a63 0%,#16294d 46%,#0f1d38 100%);color:#fff}\nheader.hero .wrap{padding-top:74px;padding-bottom:66px}\n.eyebrow{display:inline-block;font:600 12px/1 'Sora',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#2b7fa3;margin-bottom:14px}\nheader.hero .eyebrow{color:#3fd0a8;margin-bottom:20px}\nh1{font:700 clamp(30px,4.2vw,50px)/1.14 'Sora',sans-serif;letter-spacing:-.02em;margin:0 0 22px;max-width:21ch;text-wrap:pretty}\n.lede{font:400 clamp(16px,1.5vw,19px)/1.62 'Public Sans',sans-serif;color:#c8d5e6;max-width:68ch}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:26px;margin-top:46px;padding-top:34px;border-top:1px solid rgba(255,255,255,.16)}\n.stats b{display:block;font:700 38px/1 'Sora',sans-serif;background:linear-gradient(120deg,#3fd0a8,#5fb6d8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}\n.stats span{font:400 14.5px/1.5 'Public Sans',sans-serif;color:#adbdd2}\n.shelf{background:linear-gradient(180deg,#16294d 0%,#16294d 46%,#fff 46%,#fff 100%)}\n.shelf figure{margin:0}\n.shelf .shot{border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 34px 70px -34px rgba(8,18,38,.72);border:1px solid rgba(255,255,255,.14)}\nfigure img{display:block;width:100%;height:auto}\nfigcaption{font:400 14px/1.6 'Public Sans',sans-serif;color:#5b6982;margin-top:10px;text-wrap:pretty}\n.shelf figcaption{font-size:14.5px;margin-top:14px;max-width:84ch}\nsection{padding:76px 0}\nsection.tint{padding:72px 0;background:#f6f9fb;border-top:1px solid #e3e9ef;border-bottom:1px solid #e3e9ef}\nsection.navy{background:#16294d;color:#fff}\nsection.navy .eyebrow{color:#3fd0a8}\nsection.navy h2,section.navy h4{color:#fff}\nsection.navy .lead{color:#c8d5e6}\nsection.navy figcaption{color:#a9bcd4}\nsection.navy .shot{border:1px solid rgba(255,255,255,.18);box-shadow:0 16px 34px -26px rgba(0,0,0,.55)}\nh2{font:600 clamp(24px,2.8vw,34px)/1.22 'Sora',sans-serif;color:#16294d;letter-spacing:-.015em;margin:0 0 16px;text-wrap:pretty}\n.lead{font:400 16.5px/1.68 'Public Sans',sans-serif;max-width:68ch;margin:0 0 34px}\np.body{font:400 16.5px/1.68 'Public Sans',sans-serif;margin:0 0 14px}\n.shot{border:1px solid #dfe6ee;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 16px 34px -26px rgba(0,0,0,.55)}\n.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;margin:0 0 40px}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}\n.cards .c{background:#fff;border:1px solid #e3e9ef;border-radius:12px;padding:24px}\n.cards h4{font:600 16.5px/1.3 'Sora',sans-serif;color:#16294d;margin:0 0 10px}\n.cards p{font:400 15px/1.62 'Public Sans',sans-serif;margin:0;color:#4a5a75}\n.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}\n.rules .r{border-left:3px solid #3fd0a8;padding:4px 0 4px 18px}\n.rules h4{font:600 16px/1.3 'Sora',sans-serif;color:#16294d;margin:0 0 8px}\n.rules p{font:400 15px/1.6 'Public Sans',sans-serif;margin:0;color:#4a5a75}\n.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px}\n.cols .ct{font:600 13px/1 'Sora',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#2b7fa3;margin:0 0 20px}\nsection.navy .cols .ct{color:#3fd0a8}\n.cols ul{list-style:none;display:grid;gap:14px}\n.cols li{display:flex;gap:12px;font:400 15.5px/1.6 'Public Sans',sans-serif}\n.cols li i{flex:none;width:6px;height:6px;margin-top:9px;border-radius:50%;background:#2b7fa3}\nsection.navy .cols li{color:#d6e0ee}\nsection.navy .cols li i{background:#3fd0a8}\n.cols li b{font-weight:600;color:#16294d}\nsection.navy .cols li b{color:#fff}\n.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:46px}\n.aside{background:#f2f8f6;border:1px solid #dbe9e4;border-radius:14px;padding:30px}\n.aside .ct{font:600 13px/1 'Sora',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#2b7fa3;margin:0 0 18px}\n.aside .g{display:grid;gap:16px}\n.aside p{font:400 15.5px/1.6 'Public Sans',sans-serif;margin:0}\n.aside b{font-weight:600;color:#16294d}\nfooter.cta{background:#16294d;background-image:linear-gradient(120deg,#16294d 0%,#17415c 100%);color:#fff;padding:72px 0}\nfooter.cta h2{color:#fff;font:700 clamp(26px,3.2vw,40px)/1.16 'Sora',sans-serif;letter-spacing:-.02em;margin:0 0 18px}\nfooter.cta p{font:400 17px/1.66 'Public Sans',sans-serif;color:#c8d5e6;max-width:62ch;margin:0 0 30px}\nfooter.cta .fine{font:400 14px/1.6 'Public Sans',sans-serif;color:#8fa3bd;margin:0}\n@media print{.lang{display:none}section{break-inside:avoid}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"topbar\"><img src=\"5ce103d0-9d59-4d46-969e-7a530ed15e39\" alt=\"Pixel Perfekt Media\"><div class=\"lang\"><button id=\"bSk\">SK<\u002Fbutton><button id=\"bEn\" class=\"on\">EN<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div id=\"doc\"><\u002Fdiv>\n<script>\nconst T = {\neyebrow:{sk:\"Prípadová štúdia · Zdravotníctvo\",en:\"Case study · Healthcare\"},\nh1:{sk:\"Nemocnica, ktorú pacient vybaví z telefónu — a personál spravuje bez IT oddelenia\",en:\"A hospital patients can handle from a phone — run by staff with no IT department\"},\nlede:{sk:\"Pre regionálnu nemocnicu s lôžkovou aj ambulantnou časťou sme postavili jednu platformu: verejný web, online objednávanie, pacientsky portál, telemedicínu a diaľkové sledovanie zo zariadení — a k tomu administráciu, v ktorej sekretariát zmení obsah ktorejkoľvek stránky bez vývojára. Pravidlá objednávania, ochrana údajov aj prístupnosť sú vynútené na serveri, nie v prehliadači.\",en:\"For a regional hospital with inpatient and outpatient care we built one platform: a public website, online booking, a patient portal, telemedicine and remote device monitoring — plus an admin console where the front office changes any page on the site without a developer. Booking rules, data protection and accessibility are enforced on the server, not in the browser.\"},\nstats:[\n {n:\"17\",sk:\"verejných stránok v šiestich jazykoch\",en:\"public pages across six languages\"},\n {n:\"5\",sk:\"produktov na jednom backende: web, objednávanie, portál, telemedicína, monitoring\",en:\"products on one backend: site, booking, portal, telemedicine, monitoring\"},\n {n:\"0\",sk:\"kritických a vážnych nálezov prístupnosti na každej trase\",en:\"critical or serious accessibility findings on any route\"},\n {n:\"726\",sk:\"automatických testov, ktoré bežia pred každým nasadením\",en:\"automated tests running before every deployment\"}\n],\nsections:[\n{tone:\"shelf\",fig:{src:\"casestudy/img/01-home.png\",sk:\"Domovská stránka presne tak, ako ju vidí pacient: núdzové kontakty hneď pod hero blokom, objednanie a vyhľadanie lekára ako dve hlavné akcie. Celý obsah tejto stránky — vrátane nadpisu a štítku — sa edituje v administrácii v oboch jazykoch vedľa seba.\",en:\"The homepage as a patient sees it: emergency contacts directly under the hero, booking and physician search as the two primary actions. Every word on this page — headline and badge included — is edited in the admin console, both languages side by side.\"}},\n\n{tone:\"light\",type:\"split\",eyebrow:{sk:\"Východisko\",en:\"The brief\"},h2:{sk:\"Nemocnica má dve publiká a jednu kanceláriu\",en:\"Two audiences, one back office\"},\n body:[\n {sk:\"Regionálna nemocnica obsluhuje okres, ktorý má do nej ďaleko. Pacient potrebuje vedieť, či ambulancia berie nových pacientov, kedy sú návštevné hodiny a či sa dá vyšetrenie vybaviť bez cesty. Kontrolór a novinár hľadajú zmluvy, faktúry a povinne zverejňované dokumenty. Personál, ktorý to má obslúžiť, je sekretariát — nie redakcia a nie IT oddelenie.\",en:\"A regional hospital serves a district that is a long way from it. Patients need to know whether a clinic is accepting new patients, when visiting hours are, and whether a consultation can be handled without the trip. Auditors and journalists are looking for contracts, invoices and mandatory disclosures. The staff who serve all of them are the front office — not an editorial team, and not an IT department.\"},\n {sk:\"Zdravotnícky obsah má navyše vlastnosť, ktorú bežný web nemá: chybný údaj je klinické riziko. Nesprávny čas ambulancie znamená márnu cestu chorého človeka, zle preložená inštrukcia pred výkonom znamená zrušený zákrok.\",en:\"Clinical content also has a property ordinary web content does not: a wrong value is a clinical risk. A wrong clinic time means a sick person travels for nothing; a mistranslated pre-procedure instruction means a cancelled operation.\"},\n {sk:\"Otázku sme preto postavili takto: <b>čo keby nemocnica nedostala web a k nemu štyri systémy, ale jeden systém, ktorý web aj služby generuje z tých istých dát?<\u002Fb>\",en:\"So we framed the question this way: <b>what if the hospital didn't get a website plus four systems, but one system that generates the website and the services from the same data?<\u002Fb>\"}],\n aside:{title:{sk:\"Čo to znamená v praxi\",en:\"What that means in practice\"},items:[\n {sk:\"<b>Jeden zdroj pravdy.<\u002Fb> Ambulancia, jej lekár, ordinačné hodiny a jej dostupné termíny sú jeden záznam. Web, objednávanie aj portál ho čítajú.\",en:\"<b>One source of truth.<\u002Fb> A clinic, its physician, its hours and its bookable slots are one record. The site, the booking engine and the portal all read it.\"},\n {sk:\"<b>Nie je to page builder.<\u002Fb> Personál vypĺňa polia, neskladá mriežky — neprístupnú stránku nie je ako vyrobiť.\",en:\"<b>Not a page builder.<\u002Fb> Staff fill in fields, they don't assemble grids — there is no way to produce an inaccessible page.\"},\n {sk:\"<b>Pravidlá sú na serveri.<\u002Fb> Rozhranie je pohodlie; o tom, čo sa smie objednať, uložiť a zverejniť, rozhoduje API a databáza.\",en:\"<b>Rules live on the server.<\u002Fb> The interface is convenience; what may be booked, stored and published is decided by the API and the database.\"}]}},\n\n{tone:\"tint\",eyebrow:{sk:\"Platforma\",en:\"The platform\"},h2:{sk:\"Jeden backend, päť povrchov\",en:\"One backend, five surfaces\"},\n lead:{sk:\"Obsah aj klinické dáta sa zapisujú raz a objavia sa tam, kde ich publikum hľadá. Každý povrch má vlastné publikum a vlastný register — nie vlastnú databázu.\",en:\"Content and clinical data are written once and surface wherever the audience looks for them. Each surface has its own audience and its own register — not its own database.\"},\n cards:[\n {h:{sk:\"Verejný web\",en:\"Public website\"},p:{sk:\"Sedemnásť stránok: oddelenia, ambulancie, adresár lekárov, diagnostika, služby, pre pacientov, o nemocnici, kariéra, edukácia, aktuality, povinné zverejňovanie, kontakt.\",en:\"Seventeen pages: departments, clinics, physician directory, diagnostics, services, patient information, about, careers, education, news, mandatory disclosures, contact.\"}},\n {h:{sk:\"Online objednávanie\",en:\"Online booking\"},p:{sk:\"Päťkrokový sprievodca od ambulancie po potvrdenie. Pravidlá — kapacita, odporúčanie, predstih, sviatky — kontroluje server.\",en:\"A five-step wizard from clinic to confirmation. The rules — capacity, referral, lead time, holidays — are checked by the server.\"}},\n {h:{sk:\"Pacientsky portál\",en:\"Patient portal\"},p:{sk:\"Prihlásenie cez eID a SMS kód. Termíny, zdravotné záznamy, e-recepty, výsledky, súhlasy — na jednom mieste.\",en:\"eID plus SMS-code sign-in. Appointments, health records, e-prescriptions, results and consents in one place.\"}},\n {h:{sk:\"Telemedicína\",en:\"Telemedicine\"},p:{sk:\"Videokonzultácia s overením totožnosti, dotazníkom pred vyšetrením a e-receptom vystaveným do národného systému.\",en:\"Video consultation with identity verification, a pre-visit questionnaire and an e-prescription issued into the national system.\"}},\n {h:{sk:\"Diaľkový monitoring\",en:\"Remote monitoring\"},p:{sk:\"Glukomery, hodinky a tlakomery s prahovými upozorneniami a exportom do zdravotného záznamu — vždy so súhlasom pacienta.\",en:\"Glucose monitors, watches and blood-pressure cuffs with threshold alerts and export into the health record — always under patient consent.\"}},\n {h:{sk:\"Administrácia\",en:\"Admin console\"},p:{sk:\"Obsah, objednávky, používatelia, preklady, auditný záznam, GDPR nástroje a živý stav služieb.\",en:\"Content, bookings, users, translations, the audit log, GDPR tooling and live service status.\"}}]},\n\n{tone:\"light\",eyebrow:{sk:\"Verejný web · pre pacienta\",en:\"Public website · for the patient\"},h2:{sk:\"Web, ktorý obstojí pred kontrolou aj v čakárni na telefóne\",en:\"A site that stands up to an audit and to a phone in a waiting room\"},\n lead:{sk:\"Register je utilitárny: vysoký kontrast, veľké cieľové plochy, žiadny efekt závislý od myši, žiadny horizontálny posun ani pri 320 px. Fotografie sú obsah spravovaný v administrácii — s povinným alternatívnym textom v oboch jazykoch.\",en:\"The register is utilitarian: high contrast, large targets, no mouse-dependent behaviour, no horizontal scrolling even at 320px. Photography is content managed in the console — with alt text required in both languages.\"},\n figs:[{src:\"casestudy/img/02-departments.png\",sk:\"Lôžkové oddelenia s počtom lôžok, primárom a stavom. Každá karta je záznam v administrácii; poradie, ikona aj to, či sa oddelenie zobrazí na domovskej stránke, sú polia.\",en:\"Inpatient departments with bed counts, head physician and status. Every card is a record in the console; ordering, icon and whether it appears on the homepage are all fields.\"},\n {src:\"casestudy/img/04-physicians.png\",sk:\"Adresár lekárov s vyhľadávaním, filtrom „berie nových pacientov\\\" a jazykmi, ktorými lekár hovorí — podstatné v pohraničnom regióne.\",en:\"The physician directory with search, an \\\"accepting new patients\\\" filter and the languages each physician speaks — decisive in a border region.\"}],\n cols:[\n {title:{sk:\"Informácie a starostlivosť\",en:\"Information & care\"},items:[\n {sk:\"<b>Oddelenia a ambulancie<\u002Fb> s detailom: primár, zástupca, počet lôžok, ordinačné hodiny, telefón, poschodie a budova, návštevné hodiny\",en:\"<b>Departments and clinics<\u002Fb> in detail: head physician, deputy, bed count, opening hours, phone, floor and building, visiting hours\"},\n {sk:\"<b>Adresár lekárov<\u002Fb> s vyhľadávaním podľa mena aj špecializácie, filtrom dostupnosti a jazykovými značkami\",en:\"<b>Physician directory<\u002Fb> searchable by name and specialty, with an availability filter and language tags\"},\n {sk:\"<b>Diagnostika a služby<\u002Fb> — CT, RTG, ultrazvuk, laboratóriá — s prípravou pred vyšetrením a spôsobom objednania\",en:\"<b>Diagnostics and services<\u002Fb> — CT, X-ray, ultrasound, laboratory — with preparation instructions and how to book\"},\n {sk:\"<b>Pre pacientov:<\u002Fb> cenník samoplatcov, čakacie lehoty, príjem a prepustenie, dotazník spokojnosti, postup pri sťažnosti, poďakovania\",en:\"<b>For patients:<\u002Fb> self-pay price list, waiting times, admission and discharge, satisfaction survey, complaints procedure, letters of thanks\"},\n {sk:\"<b>Edukačná knižnica<\u002Fb> — materiály pred výkonom a po ňom, vždy dvojjazyčne\",en:\"<b>Education library<\u002Fb> — pre- and post-procedure material, always bilingual\"},\n {sk:\"<b>O nemocnici:<\u002Fb> história, vedenie, investície a rekonštrukcie\",en:\"<b>About:<\u002Fb> history, leadership, investment and renovation\"},\n {sk:\"<b>Kariéra<\u002Fb> s voľnými miestami a transparentným mzdovým rozpätím\",en:\"<b>Careers<\u002Fb> with open roles and transparent salary bands\"},\n {sk:\"<b>Aktuality<\u002Fb> s naplánovaným zverejnením a odberom\",en:\"<b>News<\u002Fb> with scheduled publishing and subscription\"}]},\n {title:{sk:\"Úradná časť a prístupnosť\",en:\"Official duties & accessibility\"},items:[\n {sk:\"<b>Povinné zverejňovanie:<\u002Fb> zmluvy, faktúry a objednávky vo filtrovateľnej tabuľke s hodnotou, dátumom a PDF na stiahnutie\",en:\"<b>Mandatory disclosure:<\u002Fb> contracts, invoices and orders in a filterable table with value, date and a downloadable PDF\"},\n {sk:\"<b>Úradné údaje na jednom mieste:<\u002Fb> zriaďovateľ, štatutár, IČO, kontakt, úradné hodiny, postup pri sťažnosti\",en:\"<b>Official data in one place:<\u002Fb> founder, statutory body, registration number, contact, office hours, complaints route\"},\n {sk:\"<b>Núdzový blok<\u002Fb> na každej stránke — tiesňová linka, centrálny príjem a lekáreň sú vždy na dosah\",en:\"<b>Emergency block<\u002Fb> on every page — emergency line, central reception and pharmacy always within reach\"},\n {sk:\"<b>Šesť jazykov:<\u002Fb> slovenčina a angličtina redakčne, čeština, poľština, maďarčina a ukrajinčina strojovo — klinický obsah zostáva konceptom, kým ho človek neschváli\",en:\"<b>Six languages:<\u002Fb> Slovak and English editorially, Czech, Polish, Hungarian and Ukrainian machine-translated — clinical content stays a draft until a human approves it\"},\n {sk:\"<b>WCAG 2.1 AA<\u002Fb> ako podmienka nasadenia, nie ako sľub: automatický audit beží na každej trase v oboch jazykoch a v mobilnom zobrazení pri každej zmene\",en:\"<b>WCAG 2.1 AA<\u002Fb> as a deployment condition, not a promise: an automated audit runs on every route, in both languages and on mobile, on every change\"},\n {sk:\"<b>Mobil ako prvé zariadenie:<\u002Fb> cieľové plochy minimálne 44 px, funkčné pri 130 % priblížení, čitateľné pri 320 px\",en:\"<b>Mobile as the primary device:<\u002Fb> 44px minimum targets, usable at 130% zoom, readable at 320px\"}]}]},\n\n{tone:\"navy\",eyebrow:{sk:\"Objednávanie a portál · pre pacienta\",en:\"Booking & portal · for the patient\"},h2:{sk:\"Od termínu po e-recept bez jedinej cesty do nemocnice\",en:\"From appointment to e-prescription without a single trip\"},\n lead:{sk:\"Objednávanie je jediné miesto, kde sa laik dotýka prevádzky nemocnice. Preto je krátke, hovorí, čo sa stane ďalej — a nedovolí objednať niečo, čo ambulancia nevie prijať.\",en:\"Booking is the one place where a layperson touches hospital operations. So it is short, it says what happens next — and it will not let anyone book something the clinic cannot take.\"},\n figs:[{src:\"casestudy/img/03-booking.png\",sk:\"Krok jeden z piatich: zobrazia sa len ambulancie s online objednávaním, so stavom a s upozornením, kde je potrebné odporúčanie.\",en:\"Step one of five: only clinics with online booking appear, each with its status and a flag where a referral is required.\"},\n {src:\"casestudy/img/07-portal.png\",sk:\"Portál po prihlásení cez eID: najbližší termín s možnosťou presunutia, posledná aktivita, digitálne žiadosti. Vľavo je celý rozsah — telekonzultácie, záznamy, e-recepty, výsledky, zariadenia.\",en:\"The portal after eID sign-in: next appointment with rescheduling, recent activity, digital requests. The left rail carries the full scope — teleconsults, records, e-prescriptions, results, devices.\"}],\n cols:[\n {title:{sk:\"Objednávanie\",en:\"Booking\"},items:[\n {sk:\"<b>Päť krokov:<\u002Fb> ambulancia, dátum, čas, údaje, potvrdenie — s viditeľným priebehom a možnosťou vrátiť sa\",en:\"<b>Five steps:<\u002Fb> clinic, date, time, details, confirmation — with visible progress and a way back\"},\n {sk:\"<b>Pravidlá vynútené na serveri:<\u002Fb> kapacita, predstih, sviatky, povinné odporúčanie. Podvrhnutá požiadavka je zamietnutá\",en:\"<b>Rules enforced server-side:<\u002Fb> capacity, lead time, holidays, referral requirement. A forged request is rejected\"},\n {sk:\"<b>Potvrdenie e-mailom a SMS<\u002Fb> s kódom rezervácie\",en:\"<b>E-mail and SMS confirmation<\u002Fb> with a booking code\"},\n {sk:\"<b>Presun a zrušenie<\u002Fb> pacientom do stanovenej lehoty\",en:\"<b>Reschedule and cancel<\u002Fb> by the patient inside a defined window\"},\n {sk:\"<b>Objednanie bez registrácie<\u002Fb> — portál je výhoda, nie podmienka\",en:\"<b>Booking without an account<\u002Fb> — the portal is a benefit, not a prerequisite\"}]},\n {title:{sk:\"Portál pacienta\",en:\"Patient portal\"},items:[\n {sk:\"<b>Prihlásenie cez národný eID a SMS kód<\u002Fb>, napojené na eHealth\",en:\"<b>National eID plus SMS-code sign-in<\u002Fb>, wired to the national eHealth service\"},\n {sk:\"<b>Termíny<\u002Fb> — nadchádzajúce aj minulé, s presunom a zrušením\",en:\"<b>Appointments<\u002Fb> — upcoming and past, with reschedule and cancel\"},\n {sk:\"<b>Zdravotné záznamy<\u002Fb> v štandarde FHIR R4: diagnózy, merania, prepúšťacie správy\",en:\"<b>Health records<\u002Fb> in FHIR R4: conditions, observations, discharge reports\"},\n {sk:\"<b>e-Recepty<\u002Fb> vrátane žiadosti o opakovaný predpis bez návštevy\",en:\"<b>e-Prescriptions<\u002Fb> including repeat-prescription requests without a visit\"},\n {sk:\"<b>Laboratórne výsledky<\u002Fb> s vysvetlením referenčných hodnôt\",en:\"<b>Laboratory results<\u002Fb> with reference ranges explained\"},\n {sk:\"<b>Správa súhlasov<\u002Fb> podľa čl. 7, 17 a 21 GDPR — každý súhlas odvolateľný jedným klikom\",en:\"<b>Consent management<\u002Fb> under GDPR art. 7, 17 and 21 — every consent revocable in one click\"},\n {sk:\"<b>Export a výmaz údajov<\u002Fb> na žiadosť, spracovaný v administrácii so záznamom v audite\",en:\"<b>Data export and erasure<\u002Fb> on request, processed in the console and written to the audit log\"}]}]},\n\n{tone:\"light\",eyebrow:{sk:\"Telemedicína a monitoring\",en:\"Telemedicine & monitoring\"},h2:{sk:\"Konzultácia a sledovanie pre okres, ktorý má do nemocnice hodinu cesty\",en:\"Consultation and monitoring for a district an hour from the hospital\"},\n lead:{sk:\"Videokonzultácia nie je videohovor s logom. Je to klinický úkon so zákonnou stopou: overená totožnosť, dotazník pred vyšetrením, záznam do dokumentácie a recept vystavený do národného systému.\",en:\"A video consultation is not a video call with a logo on it. It is a clinical act with a legal trail: verified identity, a pre-visit questionnaire, a note in the record and a prescription issued into the national system.\"},\n figs:[{src:\"casestudy/img/08-consult-room.png\",sk:\"Čakáreň pred konzultáciou: kontrola kamery a mikrofónu, termín na očiach, tmavé prostredie pre videohovor. Lekár sa pripája až po opätovnom overení druhým faktorom.\",en:\"The pre-consultation waiting room: camera and microphone check, the appointment in view, a dark surface for video. The physician joins only after re-verifying the second factor.\"},\n {src:\"casestudy/img/09-wearables.png\",sk:\"Pripojené zariadenia v portáli s kritickým upozornením a prepínačom zdieľania pri každom zariadení — pacient vidí presne to, čo vidí jeho lekár.\",en:\"Connected devices in the portal with a critical alert and a per-device sharing switch — the patient sees exactly what the physician sees.\"}],\n cols:[\n {title:{sk:\"Videokonzultácia\",en:\"Video consultation\"},items:[\n {sk:\"<b>Objednanie telekonzultácie<\u002Fb> ako typu vyšetrenia — rovnaký sprievodca, iná ambulancia\",en:\"<b>Booking a teleconsult<\u002Fb> as a visit type — same wizard, different clinic\"},\n {sk:\"<b>Dotazník pred vyšetrením<\u002Fb>, ktorý má lekár otvorený pri vstupe pacienta\",en:\"<b>A pre-visit questionnaire<\u002Fb> open in front of the physician as the patient enters\"},\n {sk:\"<b>Čakáreň s kontrolou kamery a mikrofónu<\u002Fb> a s terminálnym stavom, ak bolo stretnutie zrušené\",en:\"<b>Waiting room with camera and microphone check<\u002Fb>, and a terminal state if the session was cancelled\"},\n {sk:\"<b>Video v európskom regióne<\u002Fb> vrátane prenosových serverov — podmienka, ktorú overuje konfigurácia pri štarte\",en:\"<b>Video inside the EU<\u002Fb>, relay servers included — a condition the configuration validates at boot\"},\n {sk:\"<b>Nahrávanie je vypnuté<\u002Fb> a bez doloženého súhlasu poverenca ho nemožno zapnúť\",en:\"<b>Recording is off<\u002Fb> and cannot be switched on without documented DPO approval\"},\n {sk:\"<b>V zázname o stretnutí nie je totožnosť pacienta<\u002Fb> — len nepriraditeľný token\",en:\"<b>No patient identity in the session record<\u002Fb> — an opaque token only\"},\n {sk:\"<b>e-Recept po konzultácii<\u002Fb> vystavený do národného systému, kópia do dokumentácie\",en:\"<b>e-Prescription after the consult<\u002Fb>, issued into the national system with a copy to the record\"}]},\n {title:{sk:\"Diaľkové sledovanie\",en:\"Remote monitoring\"},items:[\n {sk:\"<b>Pripojenie zariadení:<\u002Fb> kontinuálny glukomer, hodinky, tlakomer — cez oficiálne rozhrania výrobcov\",en:\"<b>Device connection:<\u002Fb> continuous glucose monitor, watch, blood-pressure cuff — through the manufacturers' official interfaces\"},\n {sk:\"<b>Prahové upozornenia<\u002Fb> s kritickou hladinou, ktorú vidí ošetrujúci lekár\",en:\"<b>Threshold alerts<\u002Fb> with a critical level visible to the treating physician\"},\n {sk:\"<b>Zdieľanie po zariadeniach<\u002Fb> — pacient vypne jedno bez toho, aby zrušil ostatné\",en:\"<b>Per-device sharing<\u002Fb> — a patient can switch one off without cancelling the others\"},\n {sk:\"<b>Export meraní do zdravotného záznamu<\u002Fb> ako FHIR Observation, nie ako obrázok\",en:\"<b>Export into the health record<\u002Fb> as FHIR Observation, not as a picture\"},\n {sk:\"<b>Odvolanie súhlasu zastaví synchronizáciu okamžite<\u002Fb> a znáša merania, ktoré ešte neboli exportované\",en:\"<b>Revoking consent stops synchronisation immediately<\u002Fb> and discards measurements not yet exported\"}]}]},\n\n{tone:\"tint\",eyebrow:{sk:\"Administrácia · pre nemocnicu\",en:\"Admin console · for the hospital\"},h2:{sk:\"Celý web sa edituje bez vývojára — a každý krok má meno a čas\",en:\"The whole site is editable without a developer — and every step has a name and a timestamp\"},\n lead:{sk:\"Administrácia je tiché pracovné prostredie oddelené od webu, ktorý spravuje. Sekretariát v nej strávi desať minút týždenne, riaditeľ hodinu pred zverejnením výročnej správy.\",en:\"The console is a quiet working environment, deliberately unlike the site it manages. The front office spends ten minutes a week in it; the director spends an hour before the annual report goes out.\"},\n figs:[{src:\"casestudy/img/11-admin-content.png\",sk:\"Kolekcie v ľavom stĺpci s počtom záznamov. Každý riadok sa edituje alebo maže na mieste a zmena je na webe okamžite — bez nasadenia.\",en:\"Collections in the left rail with record counts. Each row is edited or deleted in place and the change is live immediately — with no deployment.\"},\n {src:\"casestudy/img/12-admin-page-content.png\",sk:\"Statické texty stránok ako polia, slovenčina a angličtina vedľa seba. Nadpis domovskej stránky nie je v kóde — je to záznam.\",en:\"Static page copy as fields, Slovak and English side by side. The homepage headline is not in the code — it is a record.\"}],\n cols:[\n {title:{sk:\"Obsah a štruktúra\",en:\"Content & structure\"},items:[\n {sk:\"<b>Pridanie, úprava a mazanie<\u002Fb> oddelení, ambulancií, lekárov, služieb, zariadení, aktualít a zverejňovaných dokumentov\",en:\"<b>Create, edit and delete<\u002Fb> departments, clinics, physicians, services, facilities, news items and disclosure documents\"},\n {sk:\"<b>Dvojjazyčné polia vedľa seba<\u002Fb> pri každom zázname, s viditeľným príznakom nepreloženého poľa\",en:\"<b>Bilingual fields side by side<\u002Fb> on every record, with an explicit flag on anything untranslated\"},\n {sk:\"<b>Texty stránok ako záznamy:<\u002Fb> hero, sekcie, popisy, štítky — nič podstatné nezostáva v kóde\",en:\"<b>Page copy as records:<\u002Fb> hero, sections, descriptions, badges — nothing meaningful stays in the code\"},\n {sk:\"<b>Údaje o nemocnici<\u002Fb> na jednom mieste: názov, adresa, telefóny, úradné hodiny, štatutár, identifikátory\",en:\"<b>Hospital information<\u002Fb> in one place: name, address, phone numbers, office hours, statutory body, identifiers\"},\n {sk:\"<b>Rozvrh ambulancií<\u002Fb> vrátane výnimiek, sviatkov a dovoleniek — priamo riadi dostupné termíny\",en:\"<b>Clinic schedules<\u002Fb> including exceptions, holidays and leave — these directly drive bookable slots\"},\n {sk:\"<b>Knižnica fotografií<\u002Fb> s povinným alternatívnym textom v oboch jazykoch a so zoznamom miest použitia pred zmazaním\",en:\"<b>Photo library<\u002Fb> with alt text required in both languages and a list of usages shown before deletion\"},\n {sk:\"<b>Zvýraznenie na domovskej stránke<\u002Fb> ako prepínač pri zázname, nie ako samostatná stránka\",en:\"<b>Homepage promotion<\u002Fb> as a switch on the record, not as a separate page\"},\n {sk:\"<b>Export a import obsahu<\u002Fb> a návrat k východiskovému stavu pri príprave nového prostredia\",en:\"<b>Content export and import<\u002Fb>, plus reset to defaults when preparing a new environment\"}]},\n {title:{sk:\"Prevádzka a zodpovednosť\",en:\"Operations & accountability\"},items:[\n {sk:\"<b>Správa objednávok:<\u002Fb> potvrdenie, presun, zrušenie a označenie nedostavenia sa — každý úkon so záznamom v audite\",en:\"<b>Booking administration:<\u002Fb> confirm, reschedule, cancel and mark no-show — every action written to the audit log\"},\n {sk:\"<b>Správa zariadení:<\u002Fb> zapnutie platformy, prahy upozornení a export protokolu upozornení\",en:\"<b>Device administration:<\u002Fb> enable a platform, set alert thresholds, export the alert log\"},\n {sk:\"<b>Auditný záznam<\u002Fb> — kto, čo, kedy — filtrovateľný a exportovateľný; na úrovni databázy je nemenný\",en:\"<b>Audit log<\u002Fb> — who, what, when — filterable and exportable, and immutable at the database level\"},\n {sk:\"<b>Nástroje GDPR:<\u002Fb> export údajov dotknutej osoby a výmaz na žiadosť, obidve ako sledované úkony\",en:\"<b>GDPR tooling:<\u002Fb> subject data export and erasure on request, both as tracked operations\"},\n {sk:\"<b>Preklady<\u002Fb> po menných priestoroch, so zoznamom chýbajúcich reťazcov a strojovým návrhom ako konceptom\",en:\"<b>Translations<\u002Fb> by namespace, with a list of missing strings and machine suggestions as drafts\"},\n {sk:\"<b>Používatelia a roly<\u002Fb> s povinným druhým faktorom pre každý personálny účet\",en:\"<b>Users and roles<\u002Fb> with a mandatory second factor on every staff account\"},\n {sk:\"<b>Prehľad stavu služieb<\u002Fb> — databáza, fronta, úložisko, video, prepojenie na nemocničný systém — v reálnom čase\",en:\"<b>Live service status<\u002Fb> — database, queue, storage, video, hospital-system link — in real time\"}]}]},\n\n{tone:\"light\",type:\"split\",eyebrow:{sk:\"Súlad a bezpečnosť\",en:\"Compliance & security\"},h2:{sk:\"Zákon ako podmienka nasadenia\",en:\"The law as a deployment condition\"},\n body:[\n {sk:\"Vo verejnom zdravotníctve sú prístupnosť a ochrana údajov zákonné povinnosti, nie funkcie. Preto nie sú v zozname úloh — sú v testoch, ktoré musia prejsť, aby sa vôbec dalo nasadiť.\",en:\"In public healthcare, accessibility and data protection are legal duties, not features. So they are not on a task list — they are in the tests that must pass before anything can be deployed at all.\"},\n {sk:\"Rodné číslo pacienta neexistuje v databáze v čitateľnej podobe. Auditný záznam sa nedá prepísať ani zmazať, a to ani účtom aplikácie — právomoc je odobratá na úrovni databázy a strážená spúšťačom. Do nemocničného informačného systému nezapisuje web, ale samostatný agent cez frontu správ.\",en:\"A patient's national ID does not exist in readable form in the database. The audit log cannot be rewritten or deleted, not even by the application account — the privilege is revoked at the database level and guarded by a trigger. Nothing writes to the hospital information system from the web; a separate agent does it over a message queue.\"}],\n aside:{title:{sk:\"Vynútené, nie sľúbené\",en:\"Enforced, not promised\"},items:[\n {sk:\"<b>Prístupnosť.<\u002Fb> Automatický audit na každej trase v oboch jazykoch a v mobile; nález je zlyhaný build, nie úloha na neskôr.\",en:\"<b>Accessibility.<\u002Fb> An automated audit on every route, in both languages and on mobile; a finding is a failed build, not a backlog item.\"},\n {sk:\"<b>Údaje v Európe.<\u002Fb> Databáza, súbory aj video v európskom regióne; TLS 1.3 na linke, AES-256 na disku.\",en:\"<b>Data in Europe.<\u002Fb> Database, files and video in an EU region; TLS 1.3 in transit, AES-256 at rest.\"},\n {sk:\"<b>Druhý faktor povinne<\u002Fb> pre celý personál, bez obchádzky v produkcii.\",en:\"<b>Second factor mandatory<\u002Fb> for all staff, with no production bypass.\"},\n {sk:\"<b>Strojový preklad klinického obsahu<\u002Fb> sa nedá automaticky zverejniť — zostáva konceptom, kým ho človek neschváli.\",en:\"<b>Machine-translated clinical content<\u002Fb> cannot auto-publish — it stays a draft until a human approves it.\"},\n {sk:\"<b>Testovacie režimy<\u002Fb> integrácií sú v produkcii odmietnuté konfiguračným validátorom pri štarte.\",en:\"<b>Mock modes<\u002Fb> for integrations are rejected in production by a configuration validator at boot.\"}]}},\n\n{tone:\"tint\",eyebrow:{sk:\"Opakovateľnosť\",en:\"Repeatability\"},h2:{sk:\"Jedna platforma, ďalšie mesto\",en:\"One platform, the next town\"},\n lead:{sk:\"To, čo sme postavili, nie je zákazka na jednu nemocnicu. Obsahový model, pravidlá objednávania aj administrácia sú rovnaké pre polikliniku s tromi ambulanciami aj pre okresnú nemocnicu so siedmimi oddeleniami — mení sa počet záznamov, nie produkt.\",en:\"What we built is not a one-hospital commission. The content model, the booking rules and the console are the same for a three-clinic polyclinic and for a district hospital with seven departments — the number of records changes, the product does not.\"},\n rules:[\n {h:{sk:\"Obsah je dátový model\",en:\"Content is a data model\"},p:{sk:\"Oddelenia, ambulancie, lekári, služby, dokumenty. Nová nemocnica napĺňa tie isté kolekcie — nezačína prázdnou stránkou.\",en:\"Departments, clinics, physicians, services, documents. A new hospital fills the same collections — it does not start from a blank page.\"}},\n {h:{sk:\"Jazyky podľa regiónu\",en:\"Languages by region\"},p:{sk:\"Pohraničný okres zapne maďarčinu alebo poľštinu; jazyk je konfigurácia, nie ďalší web.\",en:\"A border district switches on Hungarian or Polish; a language is configuration, not another website.\"}},\n {h:{sk:\"Moduly sa zapínajú\",en:\"Modules switch on\"},p:{sk:\"Telemedicína a diaľkové sledovanie sú voliteľné. Menšie zariadenie začne webom a objednávaním a doplní ich neskôr.\",en:\"Telemedicine and remote monitoring are optional. A smaller provider starts with the site and booking and adds them later.\"}},\n {h:{sk:\"Zástupné fotografie\",en:\"Placeholder photography\"},p:{sk:\"Nikdy nie pacienti. Fotografie sa dostanú na web len z archívu zariadenia a len cez register súhlasov.\",en:\"Never patients. Photographs reach the site only from the provider's own archive and only through the consent register.\"}}]}\n],\nctaH:{sk:\"Jedna nemocnica. Celý okres. Alebo celý kraj.\",en:\"One hospital. A whole district. Or a whole region.\"},\nctaP:{sk:\"Platforma je rovnaká pre mestskú polikliniku aj pre okresnú nemocnicu s telemedicínou. Rozdiel je v počte záznamov a v tom, ktoré moduly sú zapnuté — nie v produkte, ktorý treba postaviť odznova.\",en:\"The platform is the same for a municipal polyclinic and for a district hospital running telemedicine. The difference is the number of records and which modules are on — not a product that has to be built again.\"},\nctaFine:{sk:\"Identifikačné údaje objednávateľa, mená zdravotníckych pracovníkov aj kontaktné údaje sú v tejto štúdii zámerne nahradené. Zobrazené obrazovky pochádzajú z funkčného systému.\",en:\"The client's identifying details, clinician names and contact data have been deliberately replaced in this study. The screens shown are from the working system.\"}\n};\nlet lang=\"en\";\nconst t=v=>typeof v===\"string\"?v:v[lang];\nconst fig=f=>`<figure><div class=\"shot\"><img src=\"${f.src}\" alt=\"\"><\u002Fdiv><figcaption>${t(f)}<\u002Ffigcaption><\u002Ffigure>`;\nfunction render(){\n document.documentElement.lang=lang;\n let h=`<header class=\"hero\"><div class=\"wrap\"><span class=\"eyebrow\">${t(T.eyebrow)}<\u002Fspan><h1>${t(T.h1)}<\u002Fh1><p class=\"lede\">${t(T.lede)}<\u002Fp><div class=\"stats\">${T.stats.map(s=>`<div><b>${s.n}<\u002Fb><span>${t(s)}<\u002Fspan><\u002Fdiv>`).join(\"\")}<\u002Fdiv><\u002Fdiv><\u002Fheader>`;\n for(const s of T.sections){\n  if(s.tone===\"shelf\"){h+=`<div class=\"shelf\"><div class=\"wrap\"><figure><div class=\"shot\"><img src=\"${s.fig.src}\" alt=\"\"><\u002Fdiv><figcaption>${t(s.fig)}<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv>`;continue}\n  const cls=s.tone===\"tint\"?\"tint\":s.tone===\"navy\"?\"navy\":\"\";\n  h+=`<section class=\"${cls}\"><div class=\"wrap\">`;\n  if(s.type===\"split\"){\n   h+=`<div class=\"split\"><div><span class=\"eyebrow\">${t(s.eyebrow)}<\u002Fspan><h2>${t(s.h2)}<\u002Fh2>${s.body.map(p=>`<p class=\"body\">${t(p)}<\u002Fp>`).join(\"\")}<\u002Fdiv>`;\n   h+=`<div class=\"aside\"><p class=\"ct\">${t(s.aside.title)}<\u002Fp><div class=\"g\">${s.aside.items.map(i=>`<p>${t(i)}<\u002Fp>`).join(\"\")}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  }else{\n   h+=`<span class=\"eyebrow\">${t(s.eyebrow)}<\u002Fspan><h2>${t(s.h2)}<\u002Fh2>`;\n   if(s.lead)h+=`<p class=\"lead\">${t(s.lead)}<\u002Fp>`;\n   if(s.figs)h+=`<div class=\"figs\">${s.figs.map(fig).join(\"\")}<\u002Fdiv>`;\n   if(s.cards)h+=`<div class=\"cards\">${s.cards.map(c=>`<div class=\"c\"><h4>${t(c.h)}<\u002Fh4><p>${t(c.p)}<\u002Fp><\u002Fdiv>`).join(\"\")}<\u002Fdiv>`;\n   if(s.rules)h+=`<div class=\"rules\">${s.rules.map(r=>`<div class=\"r\"><h4>${t(r.h)}<\u002Fh4><p>${t(r.p)}<\u002Fp><\u002Fdiv>`).join(\"\")}<\u002Fdiv>`;\n   if(s.cols)h+=`<div class=\"cols\">${s.cols.map(c=>`<div><p class=\"ct\">${t(c.title)}<\u002Fp><ul>${c.items.map(i=>`<li><i><\u002Fi><span>${t(i)}<\u002Fspan><\u002Fli>`).join(\"\")}<\u002Ful><\u002Fdiv>`).join(\"\")}<\u002Fdiv>`;\n  }\n  h+=`<\u002Fdiv><\u002Fsection>`;\n }\n h+=`<footer class=\"cta\"><div class=\"wrap\"><h2>${t(T.ctaH)}<\u002Fh2><p>${t(T.ctaP)}<\u002Fp><p class=\"fine\">${t(T.ctaFine)}<\u002Fp><\u002Fdiv><\u002Ffooter>`;\n document.getElementById(\"doc\").innerHTML=h;\n document.getElementById(\"bSk\").className=lang===\"sk\"?\"on\":\"\";\n document.getElementById(\"bEn\").className=lang===\"en\"?\"on\":\"\";\n}\ndocument.getElementById(\"bSk\").onclick=()=>{lang=\"sk\";render();window.scrollTo(0,0)};\ndocument.getElementById(\"bEn\").onclick=()=>{lang=\"en\";render();window.scrollTo(0,0)};\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
