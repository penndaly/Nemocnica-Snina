<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wearables — Connect & Alerts — Nemocnica Snina</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="siteHeader"></header>
<main id="main"></main>
<footer id="siteFooter"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/wearables-demo-data.js"></script>
<script>
Site.mount({ active: "" });

/* ── i18n ───────────────────────────────────────────────────────────────── */
function gl()  { return document.documentElement.lang || "sk"; }
function L(o)  { var l=gl(); return o&&(o[l]!==undefined?o[l]:o.sk!==undefined?o.sk:o.en)||""; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ago(iso){ var ms=Date.now()-new Date(iso); if(ms<3600000){var m=Math.floor(ms/60000);return L({sk:"pred "+m+"m",en:m+"m ago"});} var h=Math.floor(ms/3600000);return L({sk:"pred "+h+"h",en:h+"h ago"}); }

/* ── Extra SVG icons ────────────────────────────────────────────────────── */
var XI = {
  bell:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
  check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  right:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  phone:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>',
  x:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  alert:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  spin:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ca-spin"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>',
  lock:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  watch:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="10" height="14" rx="3"/><path d="M9 5V3h6v2M9 19v2h6v-2"/></svg>'
};
function xi(n){ return XI[n]||""; }

/* ── Alert data ─────────────────────────────────────────────────────────── */
var ALERTS = [
  { id:1, device:{sk:"Abbott FreeStyle Libre 3",en:"Abbott FreeStyle Libre 3"},
    metric:{sk:"Glukóza",en:"Glucose"}, value:"15.1", unit:"mmol/l", severity:"critical",
    ts: new Date(Date.now()-2*3600000).toISOString(), read:false },
  { id:2, device:{sk:"Apple Watch Series 10",en:"Apple Watch Series 10"},
    metric:{sk:"Tepová frekvencia",en:"Heart rate"}, value:"148", unit:"bpm", severity:"critical",
    ts: new Date(Date.now()-4*3600000).toISOString(), read:false },
  { id:3, device:{sk:"Withings ScanWatch 2",en:"Withings ScanWatch 2"},
    metric:{sk:"TK systolický",en:"Systolic BP"}, value:"162", unit:"mmHg", severity:"high",
    ts: new Date(Date.now()-6*3600000).toISOString(), read:false }
];

/* ── Platform catalogue ─────────────────────────────────────────────────── */
var PLAT = {
  medical:[
    {id:"abbott_libre",  brand:"Abbott",           model:"FreeStyle Libre 3",    s:"normal"},
    {id:"dexcom",        brand:"Dexcom",            model:"G7 / ONE+",            s:"normal"},
    {id:"medtronic_cgm", brand:"Medtronic",         model:"Guardian 4 CGM",       s:"partnership"},
    {id:"medtronic_pm",  brand:"Medtronic",         model:"MyCareLink",           s:"partnership"},
    {id:"abbott_icd",    brand:"Abbott",            model:"Merlin.net",           s:"partnership"},
    {id:"bsc",           brand:"Boston Scientific", model:"Latitude NXT",         s:"partnership"},
    {id:"alivecor",      brand:"AliveCor",          model:"KardiaMobile 6L",      s:"upload"},
    {id:"withings_bp",   brand:"Withings",          model:"BPM Connect Pro",      s:"normal"},
    {id:"omron",         brand:"Omron",             model:"Evolv / Complete",     s:"normal"}
  ],
  consumer:[
    {id:"apple",         brand:"Apple",             model:"Watch / HealthKit",    s:"ios"},
    {id:"samsung",       brand:"Samsung",           model:"Galaxy Watch",         s:"normal"},
    {id:"google",        brand:"Google",            model:"Pixel Watch",          s:"normal"},
    {id:"fitbit",        brand:"Fitbit",            model:"Sense / Charge",       s:"normal"},
    {id:"garmin",        brand:"Garmin",            model:"Health Sync",          s:"normal"},
    {id:"huawei",        brand:"Huawei",            model:"Watch GT / Band",      s:"normal"},
    {id:"xiaomi",        brand:"Xiaomi",            model:"Smart Band / Watch",   s:"upload"},
    {id:"withings_w",    brand:"Withings",          model:"ScanWatch 2",          s:"connected"},
    {id:"meta",          brand:"Meta",              model:"Ray-Ban Glasses",      s:"partnership"}
  ]
};

/* platform permissions (scopes shown in step 2) */
var PERMS = {
  abbott_libre: {name:"Abbott LibreLink Up", scopes:[{sk:"Glukóza (CGM nepretržite)",en:"Glucose (CGM continuous)",loinc:"14745-4"}]},
  dexcom:       {name:"Dexcom",  scopes:[{sk:"Glukóza (CGM)",en:"Glucose (CGM)",loinc:"14745-4"}]},
  withings_bp:  {name:"Withings",scopes:[{sk:"Krvný tlak",en:"Blood pressure",loinc:"85354-9"},{sk:"Tepová frekvencia",en:"Heart rate",loinc:"8867-4"},{sk:"Hmotnosť",en:"Weight",loinc:"29463-7"}]},
  omron:        {name:"Omron",   scopes:[{sk:"Krvný tlak",en:"Blood pressure",loinc:"85354-9"},{sk:"Pulz",en:"Pulse rate",loinc:"8867-4"}]},
  samsung:      {name:"Samsung Health",scopes:[{sk:"Tepová frekvencia",en:"Heart rate",loinc:"8867-4"},{sk:"Kroky",en:"Steps",loinc:"55423-8"},{sk:"SpO₂",en:"SpO₂",loinc:"59408-5"}]},
  google:       {name:"Google Health Connect",scopes:[{sk:"Tepová frekvencia",en:"Heart rate",loinc:"8867-4"},{sk:"Krvný tlak",en:"Blood pressure",loinc:"85354-9"},{sk:"Glukóza",en:"Glucose",loinc:"14745-4"},{sk:"Kroky",en:"Steps",loinc:"55423-8"}]},
  fitbit:       {name:"Fitbit",  scopes:[{sk:"Tepová frekvencia",en:"Heart rate",loinc:"8867-4"},{sk:"Kroky",en:"Steps",loinc:"55423-8"},{sk:"Spánok",en:"Sleep",loinc:"93831-6"},{sk:"SpO₂",en:"SpO₂",loinc:"59408-5"}]},
  garmin:       {name:"Garmin Health",scopes:[{sk:"Tepová frekvencia",en:"Heart rate",loinc:"8867-4"},{sk:"Kroky",en:"Steps",loinc:"55423-8"},{sk:"Spánok",en:"Sleep",loinc:"93831-6"},{sk:"SpO₂",en:"SpO₂",loinc:"59408-5"}]},
  huawei:       {name:"Huawei Health Kit",scopes:[{sk:"Tepová frekvencia",en:"Heart rate",loinc:"8867-4"},{sk:"Krvný tlak",en:"Blood pressure",loinc:"85354-9"},{sk:"SpO₂",en:"SpO₂",loinc:"59408-5"}]}
};

/* ── UI state ────────────────────────────────────────────────────────────── */
var pat = DB.get("patient");
var alertOpen = false;
var oauthOpen = false;
var oauthStep = "platforms"; // platforms | perms | redirecting | success | partnership | ios | upload
var oauthTab  = "consumer";
var oauthPlat = null;

/* ── Main render ─────────────────────────────────────────────────────────── */
var main = document.getElementById("main");

function render() {
  var unread = ALERTS.filter(function(a){return !a.read;}).length;
  var criticals = ALERTS.filter(function(a){return a.severity==="critical"&&!a.read;});
  var pat = DB.get("patient");

  main.innerHTML =
    '<section class="section section-sm"><div class="container">'

    /* portal header card */
    + '<div class="card card-pad portal-header">'
    + '<div class="flex-center gap">'
    + '<span class="avatar avatar-lg">' + esc(initials(pat.name)) + '</span>'
    + '<div><h2 class="mb-0" style="font-size:1.5rem">' + esc(L({sk:"Vitajte",en:"Welcome"})) + ', ' + esc(pat.name) + '</h2>'
    + '<div class="flex gap small muted mt-1 wrap">'
    + '<span>RČ: ' + esc(pat.id) + '</span>'
    + '<span>' + esc(L({sk:"Krv",en:"Blood"})) + ': <b style="color:var(--red)">' + esc(pat.blood) + '</b></span>'
    + '<span>' + esc(pat.insurance) + '</span>'
    + '</div></div></div>'
    + '<div class="flex-center gap-sm">'
    /* Bell button */
    + '<div class="ca-bell-wrap" id="bellWrap">'
    + '<button class="ca-bell-btn" id="bellBtn" aria-label="' + esc(L({sk:"Upozornenia",en:"Alerts"})) + ' (' + unread + ')">'
    + xi("bell")
    + (unread > 0 ? '<span class="ca-badge">' + unread + '</span>' : '')
    + '</button>'
    + (alertOpen ? renderAlertPanel() : '')
    + '</div>'
    /* Logout */
    + '<button class="btn btn-ghost btn-sm">' + icon("lock") + ' ' + esc(L({sk:"Odhlásiť",en:"Sign out"})) + '</button>'
    + '</div></div>'

    /* portal grid */
    + '<div class="portal-grid mt-3">'
    /* sidebar nav */
    + '<aside class="pnav">'
    + pnavBtn("overview",  {sk:"Prehľad",en:"Overview"},       "activity")
    + pnavBtn("teleconsult",{sk:"Telekonzultácie",en:"Teleconsults"},"video")
    + pnavBtn("records",   {sk:"Záznamy",en:"Records"},        "doc")
    + pnavBtn("meds",      {sk:"e-Recepty",en:"e-Prescriptions"},"pill")
    + pnavBtn("labs",      {sk:"Výsledky",en:"Lab results"},   "flask")
    + pnavBtn("wearables", {sk:"Wearables",en:"Wearables"},    "watch", unread)
    + '</aside>'
    /* main view */
    + '<div id="pview">' + renderWearablesView(criticals) + '</div>'
    + '</div>'
    + '</div></section>'

    /* OAuth modal */
    + (oauthOpen ? renderOauthModal() : '');

  attachEvents();
}

function pnavBtn(k, lbl, ic, badge) {
  return '<button class="pnav-btn active" style="pointer-events:none">' + icon(ic) + ' ' + esc(L(lbl))
    + (badge ? ' <span class="ca-badge ca-badge-nav">' + badge + '</span>' : '')
    + (k==="wearables" ? ' <span style="font-size:.7rem;font-weight:800;margin-left:auto;color:var(--blue-600)">← here</span>' : '')
    + '</button>';
}

/* ── Wearables view ──────────────────────────────────────────────────────── */
function renderWearablesView(criticals) {
  var devCards = WEARABLES.devices.map(function(d){
    return '<div class="wr-device-card">'
      + '<div class="wr-device-head">'
      + '<div class="wr-device-icon wr-icon-' + esc(d.category) + '">' + icon(d.icon) + '</div>'
      + '<div class="wr-device-meta"><strong>' + esc(d.brand) + '</strong><span class="small muted">' + esc(d.model) + '</span></div>'
      + '<span class="badge badge-green"><span class="dot"></span>' + esc(L({sk:"Aktívne",en:"Active"})) + '</span>'
      + '</div>'
      + '<div class="wr-readings-mini">'
      + d.readings.slice(0,2).map(function(r){
          return '<div class="wr-mini-row"><span class="small muted">' + esc(L(r.metric)) + '</span>'
            + '<span class="wr-mini-val' + (r.flag==="high"?" wr-val-high":"") + '">' + esc(r.value) + (r.unit?' <span class="wr-unit">'+esc(r.unit)+'</span>':'') + '</span></div>';
        }).join("")
      + '</div>'
      + '<div class="wr-device-foot">'
      + '<span class="small muted" style="display:flex;align-items:center;gap:5px">' + icon("sync") + ' ' + esc(fmtAgo(d.lastSync)) + '</span>'
      + '<label class="wr-share-lbl"><input type="checkbox" checked onchange="return false"><span class="small">' + esc(L({sk:"Zdieľať s lekárom",en:"Share with physician"})) + '</span></label>'
      + '</div>'
      + '</div>';
  }).join("");

  return ''
    /* critical banner */
    + (criticals.length > 0 ? renderCriticalBanner(criticals[0]) : '')

    /* devices grid */
    + '<div class="card">'
    + '<div class="sec-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    + '<div class="flex-center gap-sm">' + xi("watch") + ' <span>' + esc(L({sk:"Nositeľné zariadenia",en:"Wearables & Devices"})) + '</span>'
    + ' <span class="badge badge-gray">' + esc(L({sk:"Voliteľné",en:"Optional"})) + '</span></div>'
    + '<div class="flex-center gap-sm">'
    + '<a href="consent-management.html" class="btn btn-ghost btn-sm">' + xi("shield") + ' ' + esc(L({sk:"Správa súhlasov",en:"Manage consent"})) + '</a>'
    + '<button class="btn btn-primary btn-sm" id="openConnectBtn">' + icon("bluetooth") + ' ' + esc(L({sk:"Pripojiť zariadenie",en:"Connect device"})) + '</button>'
    + '</div></div>'
    + '<div class="wr-devices-grid">' + devCards + '</div>'
    + '</div>'

    /* readings timeline (abbreviated) */
    + renderReadingsTimeline();
}

function renderCriticalBanner(a) {
  return '<div class="ca-critical-banner" role="alert">'
    + '<span class="ca-critical-ic">' + xi("alert") + '</span>'
    + '<div class="ca-critical-body">'
    + '<strong>' + esc(L({sk:"Kritické upozornenie",en:"Critical alert"})) + '</strong>'
    + ' · ' + esc(L(a.device)) + ' · '
    + '<span style="font-weight:800">' + esc(L(a.metric)) + ' ' + esc(a.value) + ' ' + esc(a.unit) + '</span>'
    + ' · ' + esc(ago(a.ts))
    + '</div>'
    + '<button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3);white-space:nowrap" id="viewAlertBtn">'
    + esc(L({sk:"Zobraziť merania",en:"View readings"})) + ' ' + xi("right") + '</button>'
    + '</div>';
}

function renderReadingsTimeline() {
  var readings = WEARABLES.devices.flatMap(function(d){return d.readings.map(function(r){return Object.assign({},r,{dBrand:d.brand});});}).sort(function(a,b){return new Date(b.time)-new Date(a.time);}).slice(0,5);
  var rows = readings.map(function(r){
    return '<div class="wr-tl-row">'
      + '<div class="wr-tl-time">' + esc(fmtAgo(r.time)) + '</div>'
      + '<div class="wr-tl-dot' + (r.flag==="high"?" wr-tl-dot-hi":"") + '"></div>'
      + '<div class="wr-tl-body">'
      + '<span class="wr-tl-metric">' + esc(L(r.metric)) + '</span>'
      + '<span class="wr-tl-val' + (r.flag==="high"?" wr-val-high":"") + '">' + esc(r.value) + (r.unit?" "+esc(r.unit):"") + '</span>'
      + '<span class="chip">' + esc(r.dBrand) + '</span>'
      + (r.flag==="high"?'<span class="badge badge-amber">'+esc(L({sk:"Zvýšené",en:"High"}))+'</span>':'<span class="badge badge-green">'+esc(L({sk:"V norme",en:"Normal"}))+'</span>')
      + '</div></div>';
  }).join("");
  return '<div class="card mt-3">'
    + '<div class="sec-head flex-center gap-sm">' + icon("activity") + '<span>' + esc(L({sk:"Posledné merania",en:"Recent readings"})) + '</span></div>'
    + '<div class="wr-timeline">' + rows + '</div></div>';
}

/* ── Alert dropdown panel ───────────────────────────────────────────────── */
function renderAlertPanel() {
  var rows = ALERTS.map(function(a){
    var isCrit = a.severity==="critical";
    return '<div class="ca-alert-row' + (isCrit?" ca-alert-crit":" ca-alert-high") + (a.read?" ca-alert-read":"") + '" data-alert-id="' + esc(a.id) + '">'
      + '<div class="ca-alert-dot-col">'
      + '<span class="ca-severity-dot' + (isCrit?" ca-dot-crit":" ca-dot-high") + '"></span></div>'
      + '<div class="ca-alert-info">'
      + '<div class="ca-alert-line1">'
      + '<span class="ca-severity-lbl ' + (isCrit?"ca-lbl-crit":"ca-lbl-high") + '">'
      + esc(L(isCrit?{sk:"KRITICKÉ",en:"CRITICAL"}:{sk:"ZVÝŠENÉ",en:"HIGH"})) + '</span>'
      + '<span class="ca-alert-metric">' + esc(L(a.metric)) + '</span>'
      + '<span class="ca-alert-val">' + esc(a.value) + ' <span style="font-weight:400;color:var(--ink-3)">' + esc(a.unit) + '</span></span>'
      + '</div>'
      + '<div class="ca-alert-line2 small muted">' + esc(L(a.device)) + ' · ' + esc(ago(a.ts)) + '</div>'
      + '</div></div>';
  }).join("");

  var unread = ALERTS.filter(function(a){return !a.read;}).length;
  return '<div class="ca-alert-panel" id="alertPanel" role="dialog" aria-label="' + esc(L({sk:"Upozornenia",en:"Alert notifications"})) + '">'
    + '<div class="ca-ap-head">'
    + '<span style="font-weight:700;font-size:.95rem">' + esc(L({sk:"Upozornenia",en:"Alert notifications"})) + '</span>'
    + (unread > 0 ? '<button class="ca-ap-readall" id="markAllReadBtn">' + esc(L({sk:"Označiť všetky",en:"Mark all read"})) + '</button>' : '<span class="small muted">'+esc(L({sk:"Všetky prečítané",en:"All read"}))+'</span>')
    + '</div>'
    + '<div class="ca-ap-list">' + rows + '</div>'
    + '<div class="ca-ap-foot">'
    + '<button class="ca-ap-viewall" id="apViewAll">' + esc(L({sk:"Zobraziť všetky merania",en:"View all readings"})) + ' ' + xi("right") + '</button>'
    + '</div></div>';
}

/* ── OAuth modal ────────────────────────────────────────────────────────── */
function renderOauthModal() {
  var stepMap = {platforms:1,perms:2,redirecting:3,success:4,partnership:4,ios:4,upload:4};
  var curStep = stepMap[oauthStep]||1;
  var inner = "";
  if (oauthStep==="platforms")   inner = renderStepPlatforms();
  if (oauthStep==="perms")       inner = renderStepPerms();
  if (oauthStep==="redirecting") inner = renderStepRedirecting();
  if (oauthStep==="success")     inner = renderStepSuccess();
  if (oauthStep==="partnership") inner = renderStepPartnership();
  if (oauthStep==="ios")         inner = renderStepIos();
  if (oauthStep==="upload")      inner = renderStepUpload();

  return '<div class="ca-overlay" id="oauthOverlay">'
    + '<div class="ca-modal" role="dialog" aria-modal="true" aria-label="' + esc(L({sk:"Pripojiť zariadenie",en:"Connect a device"})) + '">'
    + '<div class="ca-modal-head">'
    + '<div class="ca-modal-title">' + xi("watch") + ' <span>' + esc(L({sk:"Pripojiť zariadenie",en:"Connect a device"})) + '</span></div>'
    + (oauthStep!=="redirecting" ? '<button class="ca-modal-close" id="oauthClose" aria-label="'+esc(L({sk:"Zavrieť",en:"Close"}))+'">'+xi("x")+'</button>' : '')
    + '</div>'
    + renderStepDots(curStep)
    + '<div class="ca-modal-body">' + inner + '</div>'
    + '</div></div>';
}

function renderStepDots(cur) {
  if (oauthStep==="partnership"||oauthStep==="ios"||oauthStep==="upload") return "";
  var dots = [1,2,3,4].map(function(n){
    return '<span class="ca-step-dot' + (n===cur?" ca-dot-active":n<cur?" ca-dot-done":"") + '">'
      + (n<cur ? xi("check") : n) + '</span>';
  }).join("");
  return '<div class="ca-step-dots">' + dots
    + '<div class="ca-step-track"><div class="ca-step-fill" style="width:' + ((cur-1)/3*100) + '%"></div></div>'
    + '</div>';
}

function renderStepPlatforms() {
  var tabs = '<div class="ca-plat-tabs">'
    + '<button class="ca-plat-tab'+(oauthTab==="medical"?" active":"")+'" id="tabMedical">'+icon("heart")+" "+esc(L({sk:"Medicínske",en:"Medical"}))+'</button>'
    + '<button class="ca-plat-tab'+(oauthTab==="consumer"?" active":"")+'" id="tabConsumer">'+xi("watch")+" Fitness &amp; Wellness"+'</button>'
    + '</div>';

  var cards = PLAT[oauthTab].map(function(p){
    var mono = p.brand.slice(0,2).toUpperCase();
    var badge = "";
    if (p.s==="partnership") badge='<span class="ca-plat-badge ca-plat-badge-partner">'+esc(L({sk:"Dohoda",en:"Agreement"}))+'</span>';
    if (p.s==="ios")         badge='<span class="ca-plat-badge ca-plat-badge-ios">iOS</span>';
    if (p.s==="upload")      badge='<span class="ca-plat-badge ca-plat-badge-upload">'+xi("upload")+'</span>';
    if (p.s==="connected")   badge='<span class="ca-plat-badge ca-plat-badge-done">'+xi("check")+' '+esc(L({sk:"Pripojené",en:"Connected"}))+'</span>';
    return '<button class="ca-plat-card" data-plat-id="'+esc(p.id)+'" data-plat-status="'+esc(p.s)+'">'
      + '<div class="ca-plat-mono">'+esc(mono)+'</div>'
      + '<div class="ca-plat-info"><div class="ca-plat-brand">'+esc(p.brand)+'</div><div class="small muted">'+esc(p.model)+'</div></div>'
      + badge
      + '</button>';
  }).join("");

  return tabs + '<div class="ca-plat-grid">' + cards + '</div>';
}

function renderStepPerms() {

/* ── Events ─────────────────────────────────────────────────────────────── */
function attachEvents() {
  /* bell */
  var bellBtn = document.getElementById("bellBtn");
  if (bellBtn) bellBtn.onclick = function(e){ e.stopPropagation(); alertOpen=!alertOpen; render(); };
  var markAllBtn = document.getElementById("markAllReadBtn");
  if (markAllBtn) markAllBtn.onclick = function(){ ALERTS.forEach(function(a){a.read=true;}); alertOpen=true; render(); };
  var apViewAll = document.getElementById("apViewAll");
  if (apViewAll) apViewAll.onclick = function(){ alertOpen=false; render(); };
  var viewAlertBtn = document.getElementById("viewAlertBtn");
  if (viewAlertBtn) viewAlertBtn.onclick = function(){ alertOpen=true; render(); };

  /* close alert panel on outside click */
  document.onclick = function(e){
    if (alertOpen && !document.getElementById("bellWrap").contains(e.target)) { alertOpen=false; render(); }
  };

  /* open OAuth */
  var openBtn = document.getElementById("openConnectBtn");
  if (openBtn) openBtn.onclick = function(){ oauthOpen=true; oauthStep="platforms"; oauthPlat=null; render(); };

  /* close OAuth */
  var closeBtn = document.getElementById("oauthClose");
  if (closeBtn) closeBtn.onclick = function(){ oauthOpen=false; render(); };
  var overlay = document.getElementById("oauthOverlay");
  if (overlay) overlay.onclick = function(e){ if(e.target===e.currentTarget){oauthOpen=false;render();} };

  /* platform tabs */
  var tabM = document.getElementById("tabMedical");
  if (tabM) tabM.onclick = function(){ oauthTab="medical"; render(); };
  var tabC = document.getElementById("tabConsumer");
  if (tabC) tabC.onclick = function(){ oauthTab="consumer"; render(); };

  /* platform card clicks */
  document.querySelectorAll(".ca-plat-card").forEach(function(btn){
    btn.onclick = function(){
      var platId = btn.dataset.platId;
      var status = btn.dataset.platStatus;
      var platArr = PLAT.medical.concat(PLAT.consumer);
      oauthPlat = platArr.find(function(p){return p.id===platId;});
      if (status==="normal")      { oauthStep="perms"; }
      else if (status==="partnership") { oauthStep="partnership"; }
      else if (status==="ios")    { oauthStep="ios"; }
      else if (status==="upload") { oauthStep="upload"; }
      else if (status==="connected") { oauthOpen=false; }
      render();
    };
  });

  /* perms step */
  var permsBack = document.getElementById("permsBack");
  if (permsBack) permsBack.onclick = function(){ oauthStep="platforms"; render(); };
  var permsAuth = document.getElementById("permsAuth");
  if (permsAuth) permsAuth.onclick = function(){
    oauthStep="redirecting"; render();
    setTimeout(function(){ oauthStep="success"; render(); }, 2200);
  };

  /* success */
  var successClose = document.getElementById("successClose");
  if (successClose) successClose.onclick = function(){ oauthOpen=false; render(); };

  /* partnership */
  var partnerBack = document.getElementById("partnerBack");
  if (partnerBack) partnerBack.onclick = function(){ oauthStep="platforms"; render(); };
  var partnerNotify = document.getElementById("partnerNotify");
  if (partnerNotify) partnerNotify.onclick = function(){ partnerNotify.textContent=L({sk:"✓ Upozorníme vás",en:"✓ We'll notify you"}); partnerNotify.disabled=true; };

  /* ios */
  var iosBack = document.getElementById("iosBack");
  if (iosBack) iosBack.onclick = function(){ oauthStep="platforms"; render(); };

  /* upload */
  var uploadBack = document.getElementById("uploadBack");
  if (uploadBack) uploadBack.onclick = function(){ oauthStep="platforms"; render(); };
}
