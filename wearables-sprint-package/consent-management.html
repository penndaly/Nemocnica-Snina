/* ── i18n helpers ──────────────────────────────────────────────────────── */
function getLang() { return document.documentElement.lang || "sk"; }
function L(o) { var l = getLang(); return (o && (o[l] !== undefined ? o[l] : o.sk !== undefined ? o.sk : o.en)) || ""; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function fmtDT(iso) {
  if (!iso) return "—";
  var d = new Date(iso), lang = getLang();
  return d.toLocaleDateString(lang==="sk"?"sk-SK":"en-GB",{day:"numeric",month:"short",year:"numeric"})
       + ", " + d.toLocaleTimeString(lang==="sk"?"sk-SK":"en-GB",{hour:"2-digit",minute:"2-digit"});
}

        : '<span class="small muted">' + esc(L({sk:"Neaktívne",en:"Not active"})) + '</span>';

    return '<div class="cm-consent-row' + (c.required ? " cm-row-required" : "") + '">'
      + '<div class="cm-row-left">'
      + '<span class="cm-type-ic cm-type-' + esc(c.type) + '">' + consentTypeIcon(c.type) + '</span>'
      + '<div class="cm-row-info">'
      + '<strong class="cm-row-label">' + esc(L(c.label)) + '</strong>'
      + '<span class="small muted">' + esc(L(c.desc)) + '</span>'
      + tsLine
      + '</div></div>'
      + '<div class="cm-row-right">'
      + (c.required
         ? '<span class="badge badge-blue">' + esc(L({sk:"Aktívne",en:"Active"})) + '</span>'
         : '<label class="cm-toggle" title="' + esc(L({sk:"Prepnúť súhlas",en:"Toggle consent"})) + '">'
           + '<input type="checkbox"' + (c.granted ? " checked" : "")
           + ' data-device="' + esc(d.id) + '" data-type="' + esc(c.type) + '"'
           + ' aria-label="' + esc(L(c.label) + " — " + d.brand + " " + d.model) + '">'
           + '<span class="cm-toggle-track"></span></label>')
      + '</div></div>';
  }).join("");

  var deviceIcon = deviceSvg(d.icon);
  var hasAllNonRequired = d.consents.filter(function(c){return !c.required;}).every(function(c){return c.granted;});

  return '<div class="card cm-device-card" id="cmdev-' + esc(d.id) + '">'

    + '<div class="flex-center gap-sm">'

    + '<span class="badge badge-green"><span class="dot"></span>' + esc(L({sk:"Aktívne",en:"Active"})) + '</span>'

    + '<button class="btn btn-ghost btn-sm cm-disconnect-btn" data-device="' + esc(d.id) + '" style="color:var(--red);border-color:var(--line-2)">'

function renderAuditRow(e) {

/* ── Events ────────────────────────────────────────────────────────────── */
function attachEvents() {
  /* consent toggles */
  main.querySelectorAll(".cm-toggle input").forEach(function(cb) {
    cb.onchange = function() {
      var dev = STATE.devices.find(function(d){return d.id===cb.dataset.device;});
      if (!dev) return;
      var con = dev.consents.find(function(c){return c.type===cb.dataset.type;});
      if (!con) return;
      con.granted = cb.checked;
      con.grantedAt = cb.checked ? new Date().toISOString() : con.grantedAt;
      STATE.auditLog.unshift({
        ts: new Date().toISOString(),
        device: {sk: dev.brand+" "+dev.model, en: dev.brand+" "+dev.model},
        type: cb.dataset.type,
        action: cb.checked ? "granted" : "withdrawn",
        ipHash: "—"
      });
      render();
    };
  });

  /* withdraw all */
  var waBtn = document.getElementById("withdrawAllBtn");
  if (waBtn) waBtn.onclick = function(){ document.getElementById("withdrawAllModal").style.display="flex"; };
  var waCancel = document.getElementById("waCancel");
  if (waCancel) waCancel.onclick = function(){ document.getElementById("withdrawAllModal").style.display="none"; };
  var waConfirm = document.getElementById("waConfirm");
  if (waConfirm) waConfirm.onclick = function(){
    STATE.devices.forEach(function(d){
      d.consents.forEach(function(c){
        if (!c.required && c.granted) {
          c.granted = false;
          STATE.auditLog.unshift({ts:new Date().toISOString(), device:{sk:d.brand+" "+d.model,en:d.brand+" "+d.model}, type:c.type, action:"withdrawn", ipHash:"—"});
        }
      });
    });
    document.getElementById("withdrawAllModal").style.display="none";
    render();
    toast(L({sk:"Všetky súhlasy boli odvolané.",en:"All consent has been withdrawn."}));
  };

  /* disconnect */
  main.querySelectorAll(".cm-disconnect-btn").forEach(function(btn){
    btn.onclick = function(){ pendingDisconnectId = btn.dataset.device; document.getElementById("disconnectModal").style.display="flex"; };
  });
  var dcCancel = document.getElementById("dcCancel");
  if (dcCancel) dcCancel.onclick = function(){ document.getElementById("disconnectModal").style.display="none"; pendingDisconnectId=null; };
  var dcConfirm = document.getElementById("dcConfirm");
  if (dcConfirm) dcConfirm.onclick = function(){
    if (!pendingDisconnectId) return;
    var d = STATE.devices.find(function(x){return x.id===pendingDisconnectId;});
    if (d) {
      d.consents.forEach(function(c){
        if (c.granted) STATE.auditLog.unshift({ts:new Date().toISOString(), device:{sk:d.brand+" "+d.model,en:d.brand+" "+d.model}, type:c.type, action:"withdrawn", ipHash:"—"});
      });
    }
    STATE.devices = STATE.devices.filter(function(x){return x.id!==pendingDisconnectId;});
    pendingDisconnectId = null;
    document.getElementById("disconnectModal").style.display="none";
    render();
    toast(L({sk:"Zariadenie bolo odpojené.",en:"Device has been disconnected."}));
  };

  /* dismiss banner */
  var dismissBtn = document.getElementById("dismissBanner");
  if (dismissBtn) dismissBtn.onclick = function(){ bannerDismissed=true; document.getElementById("gdprBanner").style.display="none"; };

  /* modal backdrop */
  ["withdrawAllModal","disconnectModal"].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.onclick = function(e){ if(e.target===e.currentTarget){e.currentTarget.style.display="none"; pendingDisconnectId=null;} };
  });
}

/* ── Toast ─────────────────────────────────────────────────────────────── */
function toast(msg) {
  var ex = document.getElementById("cmToast"); if(ex) ex.remove();
  var t = document.createElement("div"); t.id="cmToast"; t.className="cm-toast";
  t.textContent=msg; t.setAttribute("role","status"); t.setAttribute("aria-live","polite");
  document.body.appendChild(t);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ t.classList.add("visible"); }); });
  setTimeout(function(){ t.classList.remove("visible"); setTimeout(function(){ t.remove(); },400); },3500);
}

/* ── Consent management — component styles ─────────────────────────────── */
.cm-page-head {

.cm-gdpr-banner {
  background: var(--blue-50); border-color: var(--blue-100);

}
.cm-btn-dismiss:hover { background: var(--warm-100); color: var(--ink); }

.cm-devices { display: flex; flex-direction: column; gap: 16px; }

}

  content: ''; position: absolute; left: 3px; top: 3px;
  width: 21px; height: 21px; background: #fff; border-radius: 50%;
  transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.18);
}
.cm-toggle input:checked + .cm-toggle-track { background: var(--green); }

}
