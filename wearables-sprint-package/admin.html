<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Správa obsahu — Nemocnica Snina</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="admin-body">
<div id="app"></div>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/admin.js"></script>
<script>
const app = document.getElementById("app");
let current = { type: "collection", key: "departments" }; // or {type:'singleton'} / {type:'editor', ...}
let toast = null;

function showToast(msg) {
  clearTimeout(toast);
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.innerHTML = icon("check") + " " + esc(msg);
  el.classList.add("show");
  toast = setTimeout(() => el.classList.remove("show"), 2200);
}

function render() {
  if (!ADMIN.isAuthed()) { renderLogin(); return; }
  renderShell();
}

/* ---------------- LOGIN ---------------- */
function renderLogin() {
  document.body.classList.add("admin-login-bg");
  app.innerHTML = `
    <div class="admin-login">
      <div class="card login-card">
        <div class="login-head">
          <span class="login-ic">${icon("lock")}</span>
          <h2>${esc(L({sk:"Správa obsahu",en:"Content administration"}))}</h2>
          <p class="small" style="color:#cfe">${esc(L({sk:"Nemocnica Snina — redakčný systém",en:"Nemocnica Snina — content system"}))}</p>
        </div>
        <form id="loginForm" class="card-pad">
          <label class="field"><span>${esc(L({sk:"Heslo administrátora",en:"Admin password"}))}</span>
            <input type="password" id="pw" placeholder="${esc(L({sk:"nápoveda: admin",en:"hint: admin"}))}" required autofocus></label>
          <div id="loginErr" class="login-err" style="display:none"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">${icon("lock")} ${esc(L({sk:"Prihlásiť sa do administrácie",en:"Log in to admin"}))}</button>
          <a href="index.html" class="btn btn-ghost btn-block mt-2">${icon("arrowLeft")} ${esc(L({sk:"Späť na web",en:"Back to website"}))}</a>
        </form>
      </div>
    </div>`;
  document.getElementById("loginForm").onsubmit = (e) => {
    e.preventDefault();
    if (ADMIN.login(document.getElementById("pw").value)) { document.body.classList.remove("admin-login-bg"); render(); }
    else { const err = document.getElementById("loginErr"); err.style.display = "block"; err.textContent = L({sk:"Nesprávne heslo.",en:"Incorrect password."}); }
  };
}

/* ---------------- SHELL ---------------- */
function renderShell() {
  const colKeys = Object.keys(ADMIN.SCHEMAS);
  const singKeys = Object.keys(ADMIN.SINGLETONS);
  const navItem = (key, schema, type) => {
    const count = type === "collection" ? DB.list(key).length : null;
    const isActive = current.key === key && (current.type === type || (current.type === "editor" && current.col === key));
    return `<button class="anav ${isActive?'active':''}" data-key="${key}" data-type="${type}">
      ${icon(schema.icon)} <span>${esc(L(schema.label))}</span>
      ${count!==null?`<span class="anav-count">${count}</span>`:``}
    </button>`;
  };

  app.innerHTML = `
  <div class="admin-layout">
    <aside class="admin-side">
      <a href="index.html" class="admin-brand">
        <span class="brand-mark">${icon("cross")}</span>
        <span><strong>Nemocnica Snina</strong><span class="small muted">${esc(L({sk:"Správa obsahu",en:"Content admin"}))}</span></span>
      </a>
      <div class="anav-group">
        <p class="anav-label">${esc(L({sk:"Obsah",en:"Content"}))}</p>
        ${colKeys.map(k => navItem(k, ADMIN.SCHEMAS[k], "collection")).join("")}
      </div>
      <div class="anav-group">
        <p class="anav-label">${esc(L({sk:"Nastavenia",en:"Settings"}))}</p>
        ${singKeys.map(k => navItem(k, ADMIN.SINGLETONS[k], "singleton")).join("")}
      </div>
      <div class="anav-group">
        <p class="anav-label">Telehealth</p>
        <button class="anav ${current.type==='telehealth'?'active':''}" data-key="telehealth" data-type="telehealth">${icon("video")} <span>${esc(L({sk:"Plán konzultácií",en:"Session Schedule"}))}</span></button>
      </div>
      <div class="anav-group">
        <p class="anav-label">${esc(L({sk:"Nástroje",en:"Tools"}))}</p>
        <button class="anav" id="btnExport">${icon("download")} <span>${esc(L({sk:"Export údajov",en:"Export data"}))}</span></button>
        <button class="anav" id="btnImport">${icon("doc")} <span>${esc(L({sk:"Import údajov",en:"Import data"}))}</span></button>
        <button class="anav anav-danger" id="btnReset">${icon("trash")} <span>${esc(L({sk:"Obnoviť predvolené",en:"Reset to defaults"}))}</span></button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-top">
        <div class="lang-switch lang-dark" role="group">
          <button class="${getLang()==='sk'?'active':''}" onclick="setLang('sk')">SK</button>
          <button class="${getLang()==='en'?'active':''}" onclick="setLang('en')">EN</button>
        </div>
        <div class="flex gap-sm">
          <a href="index.html" target="_blank" class="btn btn-ghost btn-sm">${icon("globe")} ${esc(L({sk:"Zobraziť web",en:"View website"}))}</a>
          <button class="btn btn-ghost btn-sm" id="btnLogout">${icon("lock")} ${esc(L({sk:"Odhlásiť",en:"Sign out"}))}</button>
        </div>
      </header>
      <div class="admin-content" id="content"></div>
    </div>
  </div>`;

  app.querySelectorAll(".anav[data-key]").forEach(b => b.onclick = () => {
    current = { type: b.dataset.type, key: b.dataset.key };
    renderShell();
  });
  document.getElementById("btnLogout").onclick = () => { ADMIN.logout(); render(); };
  document.getElementById("btnReset").onclick = () => {
    if (confirm(L({sk:"Naozaj obnoviť všetok obsah na predvolené hodnoty? Vaše zmeny sa stratia.",en:"Reset all content to defaults? Your changes will be lost."}))) {
      DB.reset(); showToast(L({sk:"Obsah obnovený.",en:"Content reset."})); renderShell();
    }
  };
  document.getElementById("btnExport").onclick = exportData;
  document.getElementById("btnImport").onclick = importData;

  renderContent();
}

function renderContent() {
  const c = document.getElementById("content");
  if (current.type === "editor") { renderEditor(c); return; }
  if (current.type === "singleton") { renderSingleton(c); return; }
  if (current.type === "telehealth") { renderTelehealth(c); return; }
  renderList(c);
}

/* ---------------- LIST ---------------- */
function renderList(c) {
  const key = current.key;
  const schema = ADMIN.SCHEMAS[key];
  const items = DB.list(key);
  c.innerHTML = `
    <div class="content-head">
      <div>
        <h1>${esc(L(schema.label))}</h1>
        <p class="muted mb-0">${items.length} ${esc(L({sk:"položiek · zmeny sa prejavia na webe okamžite",en:"items · changes appear on the site instantly"}))}</p>
      </div>
      <button class="btn btn-primary" id="btnAdd">${icon("plus")} ${esc(L({sk:"Pridať",en:"Add new"}))}</button>
    </div>
    <div class="list-rows">
      ${items.map((it, i) => {
        const titleVal = schema.titlePlain ? it[schema.title] : L(it[schema.title]);
        const sub = subtitleFor(key, it);
        return `<div class="list-row">
          <div class="lr-main">
            <span class="lr-icon">${icon(schema.icon)}</span>
            <div>
              <h4 class="mb-0">${esc(titleVal||"—")}</h4>
              <span class="small muted">${esc(sub)}</span>
            </div>
          </div>
          <div class="lr-actions">
            ${badgeFor(key, it)}
            <button class="icon-btn" data-edit="${i}" title="${esc(L({sk:'Upraviť',en:'Edit'}))}">${icon("edit")}</button>
            <button class="icon-btn icon-danger" data-del="${i}" title="${esc(L({sk:'Vymazať',en:'Delete'}))}">${icon("trash")}</button>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  document.getElementById("btnAdd").onclick = () => { current = { type: "editor", col: key, key, idx: -1 }; renderShell(); };
  c.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { current = { type: "editor", col: key, key, idx: +b.dataset.edit }; renderShell(); });
  c.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const it = items[+b.dataset.del];
    const titleVal = schema.titlePlain ? it[schema.title] : L(it[schema.title]);
    if (confirm(L({sk:"Vymazať „",en:'Delete "'}) + titleVal + '"?')) { DB.remove(key, it.id); showToast(L({sk:"Vymazané.",en:"Deleted."})); renderShell(); }
  });
}

function subtitleFor(key, it) {
  if (key === "departments") return (it.lead||"") + (it.beds?` · ${it.beds} ${L({sk:"lôžok",en:"beds"})}`:"");
  if (key === "clinics") return (it.doctor||"") + " · " + L(it.location);
  if (key === "physicians") return L(it.role);
  if (key === "services") return L(it.desc).slice(0,70);
  if (key === "facilities") return (it.lead?it.lead+" · ":"") + L(it.kind);
  if (key === "news") return fmtDate(it.date);
  if (key === "disclosures") return it.id + " · " + fmtDate(it.date);
  return "";
}
function badgeFor(key, it) {
  if (key === "clinics") return statusBadge(it.status);
  if (key === "physicians") return it.accepting ? `<span class="badge badge-green"><span class="dot"></span>${esc(t("accepting"))}</span>` : "";
  if (key === "departments") return it.featured ? `<span class="badge badge-blue">${esc(L({sk:"Úvod",en:"Home"}))}</span>` : "";
  if (key === "news") { const m={good:"badge-green",info:"badge-blue",alert:"badge-amber"}; return `<span class="badge ${m[it.type]||'badge-gray'}">${esc(L(it.tag))}</span>`; }
  if (key === "disclosures") return `<span class="badge ${it.type&&it.type.sk==='Zmluva'?'badge-blue':'badge-terra'}">${esc(L(it.type))}</span>`;
  return "";
}

/* ---------------- EDITOR ---------------- */
function renderEditor(c) {
  const key = current.col;
  const schema = ADMIN.SCHEMAS[key];
  const isNew = current.idx < 0;
  const item = isNew ? ADMIN.blank(schema) : JSON.parse(JSON.stringify(DB.list(key)[current.idx]));

  c.innerHTML = `
    <button class="link-back" id="back">${icon("arrowLeft")} ${esc(L(schema.label))}</button>
    <div class="content-head">
      <h1>${esc(isNew ? L({sk:"Nová položka",en:"New item"}) : L({sk:"Upraviť",en:"Edit"}))}</h1>
    </div>
    <form id="editForm" class="editor card card-pad">
      ${schema.fields.map(f => fieldHtml(f, item[f.k])).join("")}
      <div class="editor-actions">
        <button type="submit" class="btn btn-primary btn-lg">${icon("check")} ${esc(L({sk:"Uložiť",en:"Save"}))}</button>
        <button type="button" class="btn btn-ghost btn-lg" id="cancel">${esc(L({sk:"Zrušiť",en:"Cancel"}))}</button>
      </div>
    </form>`;

  document.getElementById("back").onclick = () => { current = { type: "collection", key }; renderShell(); };
  document.getElementById("cancel").onclick = () => { current = { type: "collection", key }; renderShell(); };
  document.getElementById("editForm").onsubmit = (e) => {
    e.preventDefault();
    const obj = readForm(schema, e.target, item);
    if (!schema.idEditable) {
      if (isNew || !obj.id) {
        const base = schema.titlePlain ? obj[schema.idFrom] : L(obj[schema.idFrom]);
        let id = ADMIN.slugify(base);
        const existing = DB.list(key).map(x => x.id);
        if (isNew) { let u = id, n = 2; while (existing.includes(u)) u = id + "-" + (n++); id = u; }
        obj.id = isNew ? id : item.id;
      } else obj.id = item.id;
    }
    DB.upsert(key, obj);
    showToast(L({sk:"Uložené.",en:"Saved."}));
    current = { type: "collection", key };
    renderShell();
  };
}

function fieldHtml(f, val) {
  const lbl = esc(L(f.label));
  if (f.t === "biltext" || f.t === "biltextarea") {
    val = val || { sk: "", en: "" };
    const tag = (l) => f.t === "biltextarea"
      ? `<textarea data-k="${f.k}" data-l="${l}" rows="3">${esc(val[l]||"")}</textarea>`
      : `<input type="text" data-k="${f.k}" data-l="${l}" value="${esc(val[l]||"")}">`;
    return `<div class="efield"><label class="efield-lbl">${lbl}</label>
      <div class="bil"><div class="bil-col"><span class="bil-tag">SK</span>${tag("sk")}</div><div class="bil-col"><span class="bil-tag">EN</span>${tag("en")}</div></div></div>`;
  }
  if (f.t === "billist") {
    val = val || { sk: [], en: [] };
    return `<div class="efield"><label class="efield-lbl">${lbl}</label>
      <div class="bil"><div class="bil-col"><span class="bil-tag">SK</span><textarea data-k="${f.k}" data-l="sk" data-list="1" rows="4">${esc((val.sk||[]).join("\n"))}</textarea></div>
      <div class="bil-col"><span class="bil-tag">EN</span><textarea data-k="${f.k}" data-l="en" data-list="1" rows="4">${esc((val.en||[]).join("\n"))}</textarea></div></div></div>`;
  }
  if (f.t === "bool") {
    return `<div class="efield"><label class="switch-row"><input type="checkbox" data-k="${f.k}" data-bool="1" ${val?"checked":""}><span>${lbl}</span></label></div>`;
  }
  if (f.t === "select") {
    return `<div class="efield"><label class="efield-lbl">${lbl}</label>
      <select data-k="${f.k}">${f.opts.map(o => `<option value="${esc(o.v)}" ${val===o.v?"selected":""}>${esc(L(o.l))}</option>`).join("")}</select></div>`;
  }
  if (f.t === "ref") {
    const opts = DB.list(f.ref);
    const sch = ADMIN.SCHEMAS[f.ref];
    return `<div class="efield"><label class="efield-lbl">${lbl}</label>
      <select data-k="${f.k}"><option value="">${esc(L({sk:"— žiadne —",en:"— none —"}))}</option>
      ${opts.map(o => { const ttl = sch.titlePlain ? o[sch.title] : L(o[sch.title]); return `<option value="${esc(o.id)}" ${val===o.id?"selected":""}>${esc(ttl)}</option>`; }).join("")}</select></div>`;
  }
  if (f.t === "tags") {
    return `<div class="efield"><label class="efield-lbl">${lbl}</label><input type="text" data-k="${f.k}" data-tags="1" value="${esc((val||[]).join(", "))}"></div>`;
  }
  if (f.t === "number") {
    return `<div class="efield"><label class="efield-lbl">${lbl}</label><input type="number" data-k="${f.k}" data-num="1" value="${esc(val!=null?val:"")}"></div>`;
  }
  if (f.t === "date") {
    return `<div class="efield"><label class="efield-lbl">${lbl}</label><input type="date" data-k="${f.k}" value="${esc(val||"")}"></div>`;
  }
  return `<div class="efield"><label class="efield-lbl">${lbl}</label><input type="text" data-k="${f.k}" value="${esc(val!=null?val:"")}"></div>`;
}

function readForm(schema, form, original) {
  const obj = JSON.parse(JSON.stringify(original || {}));
  schema.fields.forEach(f => {
    if (f.t === "biltext" || f.t === "biltextarea") {
      obj[f.k] = {
        sk: form.querySelector(`[data-k="${f.k}"][data-l="sk"]`).value,
        en: form.querySelector(`[data-k="${f.k}"][data-l="en"]`).value
      };
    } else if (f.t === "billist") {
      const toArr = (l) => form.querySelector(`[data-k="${f.k}"][data-l="${l}"]`).value.split("\n").map(s => s.trim()).filter(Boolean);
      obj[f.k] = { sk: toArr("sk"), en: toArr("en") };
    } else if (f.t === "bool") {
      obj[f.k] = form.querySelector(`[data-k="${f.k}"]`).checked;
    } else if (f.t === "tags") {
      obj[f.k] = form.querySelector(`[data-k="${f.k}"]`).value.split(",").map(s => s.trim()).filter(Boolean);
    } else if (f.t === "number") {
      const v = form.querySelector(`[data-k="${f.k}"]`).value;
      obj[f.k] = v === "" ? 0 : Number(v);
    } else if (f.t === "ref") {
      const v = form.querySelector(`[data-k="${f.k}"]`).value;
      if (v) obj[f.k] = v; else delete obj[f.k];
    } else {
      obj[f.k] = form.querySelector(`[data-k="${f.k}"]`).value;
    }
  });
  // bookingDays text -> array of numbers
  if (schema === ADMIN.SCHEMAS.clinics) {
    if (typeof obj.bookingDays === "string") {
      const arr = obj.bookingDays.split(",").map(s => parseInt(s.trim(),10)).filter(n => !isNaN(n));
      obj.bookingDays = arr.length ? arr : undefined;
    }
  }
  return obj;
}

/* ---------------- SINGLETON ---------------- */
function renderSingleton(c) {
  const key = current.key;
  const def = ADMIN.SINGLETONS[key];
  const data = JSON.parse(JSON.stringify(DB.get(key)));

  if (key === "hospital") {
    c.innerHTML = `
      <div class="content-head"><h1>${esc(L(def.label))}</h1></div>
      <form id="sform" class="editor card card-pad">
        ${def.fields.map(f => fieldHtml(f, data[f.k])).join("")}
        <div class="editor-actions"><button type="submit" class="btn btn-primary btn-lg">${icon("check")} ${esc(L({sk:"Uložiť",en:"Save"}))}</button></div>
      </form>`;
    document.getElementById("sform").onsubmit = (e) => {
      e.preventDefault();
      const obj = readForm({ fields: def.fields }, e.target, data);
      DB.save("hospital", obj);
      showToast(L({sk:"Uložené.",en:"Saved."})); renderShell();
    };
    return;
  }

  // pages: grouped editor
  c.innerHTML = `
    <div class="content-head"><h1>${esc(L(def.label))}</h1></div>
    <form id="sform" class="editor">
      ${def.groups.map(g => `
        <div class="card card-pad mb-3">
          <h3 class="mb-2">${esc(L(g.title))}</h3>
          ${g.fields.map(f => fieldHtml({ ...f, k: g.path + "." + f.k }, data[g.path][f.k])).join("")}
        </div>`).join("")}
      <button type="submit" class="btn btn-primary btn-lg">${icon("check")} ${esc(L({sk:"Uložiť obsah stránok",en:"Save page content"}))}</button>
    </form>`;
  document.getElementById("sform").onsubmit = (e) => {
    e.preventDefault();
    def.groups.forEach(g => {
      g.fields.forEach(f => {
        const k = g.path + "." + f.k;
        if (f.t === "biltext" || f.t === "biltextarea") {
          data[g.path][f.k] = {
            sk: e.target.querySelector(`[data-k="${k}"][data-l="sk"]`).value,
            en: e.target.querySelector(`[data-k="${k}"][data-l="en"]`).value
          };
        } else {
          data[g.path][f.k] = e.target.querySelector(`[data-k="${k}"]`).value;
        }
      });
    });
    DB.save("pages", data);
    showToast(L({sk:"Uložené.",en:"Saved."})); renderShell();
  };
}

/* ---------------- TELEHEALTH ---------------- */
function mkThDate(daysAhead, hour, min) {
  const d = new Date(); d.setDate(d.getDate()+daysAhead); d.setHours(hour,min,0,0); return d.toISOString();
}
const ADMIN_TH_SESSIONS = [
  { id:"th-001", scheduledAt:mkThDate(0,10,30), clinic:{sk:"Interná ambulancia",en:"Internal Medicine"}, physician:"MUDr. Jana Borščová", patientToken:"PT-84A2", status:"scheduled" },
  { id:"th-002", scheduledAt:mkThDate(0,13, 0), clinic:{sk:"FRO — Rehabilitácia",en:"Physiatry Clinic"}, physician:"MUDr. Natália Kyjovská", patientToken:"PT-22B9", status:"scheduled" },
  { id:"th-003", scheduledAt:mkThDate(0, 9,15), clinic:{sk:"Interná ambulancia",en:"Internal Medicine"}, physician:"MUDr. Jana Borščová", patientToken:"PT-91C4", status:"ended" },
  { id:"th-004", scheduledAt:mkThDate(1, 9,30), clinic:{sk:"Interná ambulancia",en:"Internal Medicine"}, physician:"MUDr. Jana Borščová", patientToken:"PT-33F1", status:"scheduled" },
  { id:"th-005", scheduledAt:mkThDate(2,11, 0), clinic:{sk:"FRO — Rehabilitácia",en:"Physiatry Clinic"}, physician:"MUDr. Natália Kyjovská", patientToken:"PT-77D5", status:"scheduled" },
  { id:"th-006", scheduledAt:mkThDate(3,14,30), clinic:{sk:"Angiologická ambulancia",en:"Angiology Clinic"}, physician:"MUDr. Peter Žemberi", patientToken:"PT-4A8B", status:"scheduled" },
  { id:"th-007", scheduledAt:mkThDate(5,10, 0), clinic:{sk:"Interná ambulancia",en:"Internal Medicine"}, physician:"MUDr. Jana Borščová", patientToken:"PT-5F2D", status:"scheduled" }
];

function renderTelehealth(c) {
  const thTab = sessionStorage.getItem("ns_admin_th_tab") || "today";
  function isToday(iso) {
    const d=new Date(iso),n=new Date();
    return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  }
  function isNextWeek(iso) {
    const d=new Date(iso),n=new Date();
    const t=new Date(n); t.setDate(t.getDate()+1); t.setHours(0,0,0,0);
    const w=new Date(n); w.setDate(w.getDate()+7); w.setHours(23,59,59,999);
    return d>=t && d<=w;
  }
  const sessions = ADMIN_TH_SESSIONS
    .filter(s => thTab==="today" ? isToday(s.scheduledAt) : isNextWeek(s.scheduledAt))
    .sort((a,b)=>new Date(a.scheduledAt)-new Date(b.scheduledAt));

  const thBadge = (st) => {
    const m={scheduled:"badge-blue",waiting:"badge-amber",active:"badge-green",ended:"badge-gray",cancelled:"badge-gray",no_show:"badge-amber"};
    const lbl={scheduled:{sk:"Naplánovaná",en:"Scheduled"},waiting:{sk:"Čaká",en:"Waiting"},active:{sk:"Probiehá",en:"Active"},ended:{sk:"Ukončená",en:"Ended"},cancelled:{sk:"Zrušená",en:"Cancelled"},no_show:{sk:"Nedostavil sa",en:"No-show"}};
    const dot = ["scheduled","waiting","active"].includes(st)?"<span class=\"dot\"></span>":"";
    return `<span class="badge ${m[st]||"badge-gray"}">${dot}${esc(L(lbl[st]||{sk:st,en:st}))}</span>`;
  };
  const fmtT = (iso) => { const d=new Date(iso); return isNaN(d)?"":d.toLocaleTimeString(getLang()==="sk"?"sk-SK":"en-GB",{hour:"2-digit",minute:"2-digit"}); };
  const fmtD = (iso) => { const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString(getLang()==="sk"?"sk-SK":"en-GB",{weekday:"short",day:"numeric",month:"short"}); };
  const tabBtn = (key,lbl) => `<button class="th-tab ${thTab===key?"active":""}" onclick="sessionStorage.setItem('ns_admin_th_tab','${key}');renderContent()">${esc(L(lbl))}</button>`;
  const isLive = (st) => ["scheduled","waiting","active"].includes(st);

  const rows = sessions.map(s => `
    <div class="th-row">
      <div class="th-col th-col-time"><strong>${esc(fmtT(s.scheduledAt))}</strong>${thTab==="week"?`<br><span class="small muted">${esc(fmtD(s.scheduledAt))}</span>`:""}</div>
      <div class="th-col th-col-clinic small muted">${esc(L(s.clinic))}</div>
      <div class="th-col">${esc(s.physician)}</div>
      <div class="th-col"><code class="th-token">${esc(s.patientToken)}</code></div>
      <div class="th-col">${thBadge(s.status)}</div>
      <div class="th-col th-col-actions">
        ${isLive(s.status)?`<a href="teleconsult.html" class="btn btn-primary btn-sm">${icon("video")} ${esc(L({sk:"Pripojiť sa",en:"Join"}))}</a>`:""}
        <button class="icon-btn" title="${esc(L({sk:"Vstupný dotazník",en:"Intake form"}))}" onclick="alert(L({sk:'Vstupný dotazník pacienta ${esc(s.patientToken)}',en:'Patient intake ${esc(s.patientToken)}'}))"
        >${icon("doc")}</button>
        ${isLive(s.status)?`<button class="icon-btn icon-danger" title="${esc(L({sk:"Zrušiť",en:"Cancel"}))}" onclick="cancelSession('${s.id}')">${icon("x")}</button>`:""}
      </div>
    </div>`).join("");

  c.innerHTML = `
    <div class="content-head">
      <div>
        <h1>${esc(L({sk:"Telehealth — Plán konzultácií",en:"Telehealth — Session Schedule"}))}</h1>
        <p class="muted mb-0">${sessions.length} ${esc(L({sk:"konzultácií · anonymizovaný prehľad (patient_token)",en:"sessions · anonymised view (patient_token)"}))}${thTab==="today"?" · <strong>"+esc(new Date().toLocaleDateString(getLang()==="sk"?"sk-SK":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))+"</strong>":""}</p>
      </div>
      <div class="th-admin-tabs">${tabBtn("today",{sk:"Dnes",en:"Today"})}${tabBtn("week",{sk:"7 dní",en:"7 days"})}</div>
    </div>
    ${sessions.length>0?`
    <div class="card">
      <div class="th-header-row">
        <span>${esc(L({sk:"Čas",en:"Time"}))}</span>
        <span>${esc(L({sk:"Ambulancia",en:"Clinic"}))}</span>
        <span>${esc(L({sk:"Lekár",en:"Physician"}))}</span>
        <span>${esc(L({sk:"Pacient (token)",en:"Patient (token)"}))}</span>
        <span>${esc(L({sk:"Stav",en:"Status"}))}</span>
        <span>${esc(L({sk:"Akcie",en:"Actions"}))}</span>
      </div>${rows}</div>`
    :`<div class="card card-pad th-empty"><span class="lr-icon">${icon("video")}</span><div><strong>${esc(L({sk:"Žiadne konzultácie",en:"No sessions"}))}</strong><p class="small muted mb-0">${esc(L({sk:"Na toto obdobie nie sú naplánované telekozultácie.",en:"No teleconsultations scheduled for this period."}))}</p></div></div>`}
  `;
}
function cancelSession(id) {
  const reason = prompt(L({sk:"Dôvod zrušenia (bude odoslaný pacientovi SMS):",en:"Cancellation reason (sent to patient via SMS):"}));
  if (reason && reason.trim()) { showToast(L({sk:"Konzultácia zrušená. SMS odoslaná.",en:"Session cancelled. SMS sent."})); renderContent(); }
}

/* ---------------- TOOLS ---------------- */
function exportData() {
  const blob = new Blob([DB.export()], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "nemocnica-snina-obsah.json"; a.click();
  URL.revokeObjectURL(url);
  showToast(L({sk:"Údaje exportované.",en:"Data exported."}));
}
function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      if (DB.import(reader.result)) { showToast(L({sk:"Údaje importované.",en:"Data imported."})); renderShell(); }
      else alert(L({sk:"Neplatný súbor.",en:"Invalid file."}));
    };
    reader.readAsText(file);
  };
  inp.click();
}
