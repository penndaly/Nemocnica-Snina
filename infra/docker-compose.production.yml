# Production overlay — merge over docker-compose.yml via:
#   docker-compose -f infra/docker-compose.yml -f infra/docker-compose.production.yml up -d
#
# Key hardening vs. the dev compose:
#   - No exposed ports on the internal services (Postgres/Redis/RabbitMQ/Strapi)
#   - TLS transport for Redis (rediss://) and RabbitMQ (amqps://) via env
#   - Production images (built + tagged, not bind-mounted dev dirs)
#   - Resource limits
#   - No "changeme" defaults — every secret MUST be set in the environment
#   - ns_app DB role with INSERT+SELECT only on audit_log (applied via make db-harden post-deploy)

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: nsadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nemocnica_snina
    ports: []             # no external exposure in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits: { cpus: "2", memory: "2G" }

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --tls-port 6380
      --port 0
      --tls-cert-file /tls/redis.crt
      --tls-key-file  /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
    volumes:
      - redis_data:/data
      - ${TLS_CERT_DIR}:/tls:ro
    ports: []

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: nsqueue
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ${RABBITMQ_CONF_DIR}:/etc/rabbitmq:ro   # contains rabbitmq.conf enabling TLS
    ports: []

  strapi:
    image: ${REGISTRY}/nemocnica-strapi:${IMAGE_TAG}
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nemocnica_strapi
      DATABASE_USERNAME: nsadmin
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT}
      JWT_SECRET: ${STRAPI_JWT}
      ALLOWED_ORIGINS: ${APP_BASE_URL}
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1", memory: "1G" }

  api:
    image: ${REGISTRY}/nemocnica-api:${IMAGE_TAG}
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ns_app:${NS_APP_PASSWORD}@postgres:5432/nemocnica_snina
      DATABASE_MIGRATION_URL: postgresql://nsadmin:${POSTGRES_PASSWORD}@postgres:5432/nemocnica_snina
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6380
      RABBITMQ_URL: amqps://nsqueue:${RABBITMQ_PASSWORD}@rabbitmq:5671
      JWT_SECRET: ${JWT_SECRET}
      MFA_REQUIRED: "true"
      OIDC_MOCK_ENABLED: "false"
      HIS_MOCK_ENABLED: "false"
      SMS_PROVIDER: ${SMS_PROVIDER}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      ALLOWED_ORIGINS: ${APP_BASE_URL}
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "2", memory: "1G" }

  web:
    image: ${REGISTRY}/nemocnica-web:${IMAGE_TAG}
    restart: always
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${API_BASE_URL}
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${APP_BASE_URL}/sk/portal/callback
      OIDC_SCOPES: "openid profile"
      OIDC_MOCK_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits: { cpus: "2", memory: "1G" }

  # Nginx reverse proxy — terminates TLS, enforces headers
  nginx:
    image: nginx:1.25-alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR}:/tls:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
      - strapi

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
