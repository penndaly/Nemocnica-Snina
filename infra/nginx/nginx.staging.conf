# Staging / demo edge.
#
# Differs from nginx.conf (production) in two deliberate ways:
#
#  1. `server_name _` — a catch-all, so the same config works for whatever
#     hostname the demo host is given without editing this file.
#  2. The API is proxied on the **/backend path of the same hostname** rather
#     than a separate api.* subdomain. A demo then needs ONE DNS record and ONE
#     certificate instead of two. nginx strips the /backend prefix, so
#     https://<host>/backend/api/health reaches NestJS as /api/health —
#     STAGING_API_URL (= NEXT_PUBLIC_API_URL for the web image) is therefore
#     https://<host>/backend, and the code appends /api/… as it does everywhere.
#
#     STG-3 (2026-09-12): this used to be `location /api/`, which sent EVERY
#     /api/* request to NestJS. The Next.js app also owns /api/* route
#     handlers (/api/aps, /api/portal/*, /api/telehealth/sessions/*,
#     /api/payments/receipt/*, /api/content) — the server-side proxies that
#     turn the httpOnly patient-session cookie into the x-patient-session
#     header. NestJS controllers use the same prefixes (api/portal,
#     api/telehealth/sessions, api/payments, api/aps), so the two cannot be
#     split by path; the blanket rule silently shadowed the web handlers and
#     the portal/APS/telehealth flows would have 401'd or 404'd on staging.
#     Never exercised, because no staging host has existed yet.
#
# The CSP header is deliberately NOT set here: apps/web/next.config.ts already
# emits a per-response CSP that is built from NEXT_PUBLIC_API_URL, and a second
# header at the edge would apply the intersection of both and break the app.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

  # Demo environment — make it unmistakable in any captured response.
  add_header X-Environment "staging-demo-mock-mode" always;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate      /tls/nemocnicasnina.crt;
    ssl_certificate_key  /tls/nemocnicasnina.key;
    ssl_protocols        TLSv1.3 TLSv1.2;
    ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    client_max_body_size 50m;   # matches the API's multipart limit

    # Trailing slash on proxy_pass = strip the matched /backend/ prefix.
    location /backend/ {
      proxy_pass http://api:4000/;
      proxy_read_timeout 120s;
    }

    # The blanket Permissions-Policy above disables camera/microphone
    # everywhere — nginx's add_header fully resets (doesn't merge) once
    # redeclared in a more specific context, so this must repeat every
    # header it needs. Without this the telehealth video room would be
    # blocked from using the camera/mic it actually needs.
    location ~ ^/[a-z][a-z]/telehealth/konzultacia/ {
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header X-Frame-Options           "SAMEORIGIN" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=(self)" always;
      add_header X-Environment "staging-demo-mock-mode" always;

      proxy_pass http://web:3000;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_read_timeout 120s;
    }
  }
}
