worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
  # ── Security headers ───────────────────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
  # CSP is deliberately NOT set here: apps/web/next.config.ts already emits a
  # per-response CSP built from NEXT_PUBLIC_API_URL (and LiveKit/Firebase
  # origins) — a second header at the edge would apply the intersection of
  # both and silently narrow whatever Next.js computed. Same reasoning as
  # nginx.staging.conf, which documents this same omission.

  # ── Redirect HTTP → HTTPS ──────────────────────────────────
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS — public site ────────────────────────────────────
  server {
    listen 443 ssl;
    ssl_certificate      /tls/nemocnicasnina.crt;
    ssl_certificate_key  /tls/nemocnicasnina.key;
    ssl_protocols        TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    server_name nemocnicasnina.sk www.nemocnicasnina.sk;

    client_max_body_size 50m;   # matches the API's multipart limit (main.ts, @fastify/multipart)

    # /admin/* (the Next.js admin UI, app-auth-protected) and /api/* (Next.js's
    # own App Router route handlers — a BFF layer, distinct from the separate
    # api.nemocnicasnina.sk subdomain below which fronts the NestJS service
    # directly) are both part of the web app and belong on this same upstream.
    # A previous `location ~ ^/(admin|api)/ { allow all; }` block here had no
    # proxy_pass — nginx picks a matching regex location over this prefix one,
    # so every /admin/* and /api/* request fell into that block and 404'd
    # against nginx's own empty docroot instead of ever reaching the app. The
    # "block bots"/"IP whitelist for admin" it gestured at was never actually
    # implemented (no headers, no ACL) — removed rather than fixed in place,
    # since this prefix location already correctly handles every path.
    # The blanket Permissions-Policy above disables camera/microphone for
    # every path — nginx's `add_header` doesn't merge with a parent context,
    # it fully resets once any add_header appears in a more specific one, so
    # this location must repeat every header it needs. Without this, the
    # telehealth video room (which genuinely needs camera/mic) would be
    # blocked here even after apps/web/next.config.ts allows it, since a
    # regex location like this always wins over the `location /` prefix
    # below regardless of declaration order.
    location ~ ^/[a-z][a-z]/telehealth/konzultacia/ {
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header X-Frame-Options           "SAMEORIGIN" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=(self)" always;

      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }
  }

  # ── HTTPS — API (internal subdomain or path) ──────────────
  server {
    listen 443 ssl;
    ssl_certificate      /tls/nemocnicasnina.crt;
    ssl_certificate_key  /tls/nemocnicasnina.key;
    ssl_protocols        TLSv1.3;

    server_name api.nemocnicasnina.sk;

    location / {
      proxy_pass         http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
  }
}
