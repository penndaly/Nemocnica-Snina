worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
  # ── Security headers ───────────────────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
  # CSP — tighten further when inline styles are removed
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors 'none';"
    always;

  # ── Redirect HTTP → HTTPS ──────────────────────────────────
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS — public site ────────────────────────────────────
  server {
    listen 443 ssl;
    ssl_certificate      /tls/nemocnicasnina.crt;
    ssl_certificate_key  /tls/nemocnicasnina.key;
    ssl_protocols        TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    server_name nemocnicasnina.sk www.nemocnicasnina.sk;

    # Block bots on sensitive paths
    location ~ ^/(admin|api)/ {
      allow all;  # access controlled by app auth; add IP whitelist for admin if desired
    }

    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }
  }

  # ── HTTPS — API (internal subdomain or path) ──────────────
  server {
    listen 443 ssl;
    ssl_certificate      /tls/nemocnicasnina.crt;
    ssl_certificate_key  /tls/nemocnicasnina.key;
    ssl_protocols        TLSv1.3;

    server_name api.nemocnicasnina.sk;

    location / {
      proxy_pass         http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
  }
}
